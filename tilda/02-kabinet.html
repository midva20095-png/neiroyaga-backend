.vb-q8m-emblem__orbit{position:absolute;inset:-4px;border-radius:50%;animation:vb-q8mSpin 4.5s linear infinite}

.vb-q8m-logo__name::before{color:var(--cyan)}

.vb-q8m-logo__suffix{padding:3px 7px;border-radius:6px;font-family:var(--f-d);font-size:10px;font-weight:700;letter-spacing:.14em;color:#08081a;

  box-shadow:0 0 12px rgba(255,45,149,.35);animation:vb-q8mBgMove 5s ease-in-out infinite alternate}
.vb-q8m-logo__flash{position:absolute;inset:-18px;z-index:1;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(0,255,224,.5),rgba(255,45,149,.3) 40%,transparent 70%)}
.vb-q8m-logo__sparks{position:absolute;left:23px;top:50%;width:0;height:0;z-index:3;pointer-events:none}
.vb-q8m-spark{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc),0 0 16px var(--sc);
  animation:vb-q8mSpark .8s cubic-bezier(.22,1,.36,1) var(--sd,0ms) forwards;opacity:0}
.vb-q8m-logo.is-on .vb-q8m-logo__core{animation:vb-q8mShake .45s cubic-bezier(.36,.07,.19,.97) both}
.vb-q8m-logo.is-on .vb-q8m-emblem{animation:vb-q8mSpinIn .8s cubic-bezier(.34,1.5,.64,1)}
.vb-q8m-logo.is-on .vb-q8m-logo__name::before{animation:vb-q8mGlitchA .5s steps(5) both}

@media (hover:hover){.vb-q8m-logo:hover .vb-q8m-emblem__ring{animation-duration:1.2s}.vb-q8m-logo:hover .vb-q8m-emblem__orbit{animation-duration:1.6s}}

/* ── Навигация (компьютер) ── */
.vb-q8m-nav{margin-left:auto}
.vb-q8m-nav__list{display:flex;align-items:center;gap:3px;padding:5px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);

.vb-q8m-icon{

}

  background:color-mix(in srgb,var(--c) 13%,transparent);border-color:color-mix(in srgb,var(--c) 50%,transparent);

/* подсказка */
.vb-q8m-icon::after{content:attr(data-label);position:absolute;top:calc(100% + 12px);left:50%;z-index:20;

.vb-q8m-icon--search::before{content:"";position:absolute;inset:-1px;border-radius:13px;border:1px solid var(--c);pointer-events:none;animation:vb-q8mPing 3.2s ease-out infinite}

/* ИИ-сфера */
.vb-q8m-ai{position:relative;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:conic-gradient(from 0deg,#00ffe0,#4c8dff,#b366ff,#ff2d95,#ffcc33,#00ffe0);

  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}

  background:conic-gradient(from var(--vb-q8m-ang),#00ffe0,#b366ff,#ff2d95,#ffcc33,#00ffe0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:vb-q8mAng 4s linear infinite}

.vb-q8m-cab:hover,.vb-q8m-cab:focus-visible{transform:translateY(-2px);box-shadow:0 8px 30px rgba(179,102,255,.45),0 0 26px rgba(0,255,224,.25)}

.vb-q8m-cab__chev{width:16px;height:16px;margin-left:-2px;opacity:.7;transition:transform .3s}
/* выпадающее меню кабинета */
.vb-q8m-cabwrap{position:relative;flex:none}
.vb-q8m-cabwrap::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px}
.vb-q8m-menu{position:absolute;right:0;top:calc(100% + 12px);z-index:30;min-width:240px;padding:8px;border-radius:18px;
  background:rgba(12,12,32,.96);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid rgba(179,102,255,.35);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 30px rgba(179,102,255,.18);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top right;
  transition:opacity .2s ease,transform .3s cubic-bezier(.34,1.56,.64,1),visibility .2s}
.vb-q8m-menu::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,#00ffe0,#ff2d95,transparent)}
.vb-q8m-cabwrap:hover .vb-q8m-menu,.vb-q8m-cabwrap:focus-within .vb-q8m-menu{opacity:1;visibility:visible;transform:none}
.vb-q8m-cabwrap:hover .vb-q8m-cab__chev,.vb-q8m-cabwrap:focus-within .vb-q8m-cab__chev{transform:rotate(180deg)}
.vb-q8m-menu__a{display:flex;align-items:center;gap:11px;padding:8px 12px 8px 8px;border-radius:12px;font-size:14px;font-weight:700;color:#eef0ff;outline:none;transition:background-color .2s,color .2s}
.vb-q8m-menu__i{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;color:#08081a;

.vb-q8m-menu__a:hover,.vb-q8m-menu__a:focus-visible{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}

/* ── Мобильные элементы (скрыты на компьютере) ── */
.vb-q8m-back,.vb-q8m-quick{display:none}

  .vb-q8m-back svg{width:20px;height:20px}

/* ── Шторка-меню ── */
.vb-q8m-dim{position:fixed;inset:0;z-index:9997;background:rgba(3,3,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
.vb-q8m-dim.is-open{opacity:1;visibility:visible}
.vb-q8m-curtain{
  position:fixed;left:0;right:0;top:var(--vb-q8m-h,58px);z-index:9998;
  max-height:calc(100vh - var(--vb-q8m-h,58px) - 12px);max-height:calc(100dvh - var(--vb-q8m-h,58px) - 12px);overflow-y:auto;overscroll-behavior:contain;
  padding:14px 14px 16px;border-radius:0 0 26px 26px;
  background:rgba(10,10,30,.95);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.08);border-top:0;box-shadow:0 24px 50px rgba(0,0,0,.65),0 0 40px rgba(255,45,149,.1);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#f2f4ff;-webkit-font-smoothing:antialiased;
  transform:translateY(-16px);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .3s ease,visibility .3s;
}
.vb-q8m-curtain.is-open{transform:none;opacity:1;visibility:visible}
.vb-q8m-curtain__list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
.vb-q8m-tile{opacity:0;transform:translateY(-10px) scale(.94)}
.vb-q8m-curtain.is-open .vb-q8m-tile{animation:vb-q8mTileIn .45s cubic-bezier(.34,1.56,.64,1) calc(.04s + var(--i,0) * .035s) forwards}
.vb-q8m-tile a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:88px;padding:12px 4px 10px;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 28%,transparent),transparent 65%),linear-gradient(170deg,#191940,#0e0e28);
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 8px 20px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.vb-q8m-tile a:active{transform:scale(.93);box-shadow:0 0 26px color-mix(in srgb,var(--c) 50%,transparent)}
.vb-q8m-tile a.is-current{border-color:var(--c);box-shadow:0 0 20px color-mix(in srgb,var(--c) 35%,transparent)}
.vb-q8m-tile--wide{grid-column:1 / -1}
.vb-q8m-tile--wide a{flex-direction:row;min-height:64px;gap:12px}
.vb-q8m-tile--wide .vb-q8m-tile__label{font-size:14px;font-weight:800}
.vb-q8m-tile__icon{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;color:#08081a;
  background:linear-gradient(135deg,var(--c),var(--c2,var(--c)));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.vb-q8m-tile__icon svg{width:23px;height:23px;fill:none}
.vb-q8m-tile__icon .vb-q8m-vk{fill:currentColor}
.vb-q8m-tile__label{font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;color:rgba(255,255,255,.9)}
.vb-q8m-ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.28);transform:scale(0);animation:vb-q8mTap .55s ease-out forwards}
@media (max-width:420px){.vb-q8m-curtain__list{grid-template-columns:repeat(3,1fr)}}
@media (min-width:861px){.vb-q8m-curtain,.vb-q8m-dim{display:none !important}}

/* ═══ Анимации ═══ */
@keyframes vb-q8mDrop{from{transform:translateY(-100%)}}
@keyframes vb-q8mLine{to{background-position:-200% 0}}
@keyframes vb-q8mAng{to{--vb-q8m-ang:360deg}}
@keyframes vb-q8mBgMove{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes vb-q8mShake{15%{transform:translate(-4px,1px) skewX(-3deg)}30%{transform:translate(5px,-1px) skewX(3deg)}45%{transform:translate(-3px,1px)}60%{transform:translate(2px,0)}}
@keyframes vb-q8mSpinIn{40%{transform:rotate(200deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
@keyframes vb-q8mGlitchA{0%,100%{opacity:0}20%{opacity:1;transform:translate(-3px,1px);clip-path:inset(10% 0 60% 0)}50%{opacity:1;transform:translate(3px,-1px);clip-path:inset(55% 0 10% 0)}80%{opacity:.6;transform:translate(-1px,0);clip-path:inset(30% 0 40% 0)}}
@keyframes vb-q8mGlitchB{0%,100%{opacity:0}25%{opacity:1;transform:translate(3px,-1px);clip-path:inset(60% 0 5% 0)}55%{opacity:1;transform:translate(-3px,1px);clip-path:inset(5% 0 70% 0)}}
@keyframes vb-q8mFlash{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
@keyframes vb-q8mSpark{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1 * var(--dist)))}}
@keyframes vb-q8mPing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes vb-q8mSpin{to{transform:rotate(360deg)}}
@keyframes vb-q8mSpinR{to{transform:rotate(-360deg)}}
@keyframes vb-q8mEye{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes vb-q8mRipple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}

  function cropBox() {
    var box = document.getElementById('nyk-crop');
    if (box) return box;

    box.className = 'nyk-crop';

    document.body.appendChild(box);

      if (e.button) return;
      CROP.down = true; CROP.px = e.clientX; CROP.py = e.clientY;
      e.preventDefault();
    });

      if (!CROP.down) return;

    });
    window.addEventListener('pointerup', function () { CROP.down = false; });
    box.querySelector('#nyk-czoom').addEventListener('input', function (e) { cropZoom(+e.target.value); });
    box.querySelector('#nyk-cno').addEventListener('click', cropClose);
    box.querySelector('#nyk-cok').addEventListener('click', cropSave);
    return box;
  }
  function cropMetrics() {
    var frame = document.getElementById('nyk-cframe');
    var fw = frame.clientWidth, fh = frame.clientHeight;
    var s = Math.max(fw / CROP.img.width, fh / CROP.img.height) * CROP.z;
    return { fw: fw, fh: fh, s: s, w: CROP.img.width * s, h: CROP.img.height * s };
  }
  function cropPaint() {
    var m = cropMetrics();
    if (CROP.x > 0) CROP.x = 0;
    if (CROP.y > 0) CROP.y = 0;
    if (CROP.x < m.fw - m.w) CROP.x = m.fw - m.w;
    if (CROP.y < m.fh - m.h) CROP.y = m.fh - m.h;
    var img = document.getElementById('nyk-cimg');
    img.style.setProperty('width', m.w + 'px', 'important');
    img.style.setProperty('height', m.h + 'px', 'important');
    img.style.setProperty('transform', 'translate(' + CROP.x + 'px,' + CROP.y + 'px)', 'important');
  }
  function cropZoom(nz) {
    var m = cropMetrics();
    var cx = (m.fw / 2 - CROP.x) / m.s, cy = (m.fh / 2 - CROP.y) / m.s;
    CROP.z = nz;

    CROP.x = m.fw / 2 - cx * n.s;
    CROP.y = m.fh / 2 - cy * n.s;
    cropPaint();
  }

      if (pop.classList.contains('on') && pop.getAttribute('data-mode') === (stick ? 'stick' : 'emo')) { pop.classList.remove('on'); return; }
      var list = stick ? MAIL_STICK : MAIL_EMO;
      pop.setAttribute('data-mode', stick ? 'stick' : 'emo');
      pop.innerHTML = list.map(function (e) { return '<button type="button" data-a="' + (stick ? 'mailstickpick' : 'mailpick') + '">' + e + '</button>'; }).join('');
      pop.classList.add('on');
      return;
    }
    if (a === 'mailpick') {
      var inp = document.getElementById('nyk-mailin');
      if (!inp) return;
      inp.value = (inp.value || '') + (el.textContent || '').trim();
      var pop = document.getElementById('nyk-emopop'); if (pop) pop.classList.remove('on');
      try { inp.focus(); } catch (err) {}
      return;
    }
    if (a === 'mailstickpick') { sendMailSticker(el.textContent || ''); return; }
    if (a === 'mailedit') {
      var mid = el.getAttribute('data-id');
      var msg = el.closest('.nyk-msg');
      if (!mid || !msg) return;
      var cur = msg.childNodes[0] ? msg.childNodes[0].textContent : '';
      nyModal('Изменить сообщение', cur, function (txt) {
      if (txt === null || !txt.trim()) return;
      if (txt === null || !txt.trim()) return;
      req('/api/dm/edit', { method: 'POST', body: JSON.stringify({ email: S.email, token: S.token, nick: S.mailWith, id: +mid, text: txt.trim() }) }).then(function (x) {
        if (!x || !x.ok) { toast((x && x.error) || 'Не получилось'); return; }
        toast('Сообщение изменено');
        loadMail(S.mailWith);
      }).catch(function () { toast('Нет связи с сервером'); });
      });
      return;
    }
    if (a === 'maildel') {
      var mid = el.getAttribute('data-id');
      if (!mid || !window.confirm('Удалить это сообщение?')) return;
      req('/api/dm/delete', { method: 'POST', body: JSON.stringify({ email: S.email, token: S.token, nick: S.mailWith, id: +mid }) }).then(function (x) {
        if (!x || !x.ok) { toast((x && x.error) || 'Не получилось'); return; }
        toast('Сообщение удалено');
        loadMail(S.mailWith);
      }).catch(function () { toast('Нет связи с сервером'); });
      return;
    }
    if (a === 'frdo') {
      var act = el.getAttribute('data-act');
      if (act === 'remove' && !window.confirm('Убрать из друзей?')) return;
      req('/api/forum/friend', { method: 'POST', body: JSON.stringify({ email: S.email, token: S.token, nick: el.getAttribute('data-nick'), action: act }) }).then(function (x) {
        if (!x || !x.ok) { toast((x && x.error) || 'Не получилось'); return; }
        toast(act === 'accept' ? 'Заявка принята' : act === 'decline' ? 'Заявка отклонена' : act === 'cancel' ? 'Заявка отменена' : 'Готово');
        loadMates();
      }).catch(function () { toast('Нет связи с сервером'); });
      return;
    }
    if (a === 'font') {
      req('/api/account/font', { method: 'POST', body: JSON.stringify({ email: S.email, token: S.token, font: el.getAttribute('data-f') || '' }) }).then(function (x) {
        if (!x || !x.ok) { toast((x && x.error) || 'Шрифт не сохранился'); return; }
        if (S.acc) S.acc.font = x.font || '';
        toast('Шрифт сохранён'); draw();
      }).catch(function (e) { if (e && e.auth) logout(); else toast('Нет связи с сервером'); });
      return;
    }
    if (a === 'nicksave') {
      var nv = (document.getElementById('nyk-nick').value || '').trim();
      req('/api/account/nick', { method: 'POST', body: JSON.stringify({ email: S.email, token: S.token, nick: nv }) }).then(function (x) {
        if (!x || !x.ok) { toast((x && x.error) || 'Ник не сохранился'); return; }
        if (S.acc) S.acc.nick = x.nick;
        toast('Ник сохранён: ' + x.nick); draw();
      }).catch(function (e) { if (e && e.auth) logout(); else toast('Нет связи с сервером'); });
      return;
    }
    if (a === 'promoapply') { promoApply(el); return; }
    if (a === 'giftbuy') { giftBuy(el); return; }
    if (a === 'giftcopy') { copyText(el.getAttribute('data-c'), 'Код сертификата скопирован'); return; }
    if (a === 'supsend') { var ta = document.getElementById('nyk-supta'), v = ta.value.trim(); if (v && supSend(v.slice(0, 3000)) !== false) ta.value = ''; return; }
    if (a === 'supfile') { document.getElementById('nyk-supfile').click(); return; }
    if (a === 'refcopy') { copyText(S.ref.code, 'Код скопирован'); return; }
    if (a === 'reflink') { copyText(S.ref.link, 'Ссылка скопирована'); return; }
    if (a === 'refshare') { try { navigator.share({ title: 'НейроЯга', text: 'Попробуй НейроЯгу — картинки, видео и песни с ИИ. Мой код: ' + S.ref.code, url: S.ref.link }); } catch (e) {} return; }
    if (a === 'refapply') { var v = (document.getElementById('nyk-refin').value || '').trim(); if (!v) { toast('Введите код'); return; } applyRef(v, false); return; }
    if (a === 'msgopen') { openMessenger(); return; }
    if (a === 'login') doLogin(el);
    else if (a === 'forgot') forgotView();
    else if (a === 'forgotsend') forgotSend(el);
    else if (a === 'tologin') loginView();
    else if (a === 'resetsave') resetSave(el);
    else if (a === 'logout') logout();
    else if (a === 'topup') { S.tab = 'over'; S.pay = true; draw(); window.scrollTo(0, 0); }
    else if (a === 'buy') buy(el);
    else if (a === 'more') { S.n += 30; draw(); }
    else if (a === 'pwsave') pwSave(el);
  });
  document.getElementById('nyk-view').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (b && b.getAttribute('data-a') === 'wdel') { delWork(b.getAttribute('data-id')); return; }
    if (b && b.getAttribute('data-a') === 'wforum') { publishWork(b.getAttribute('data-id')); return; }
    if (b && b.getAttribute('data-a') === 'fpub') {
      var cap = (document.getElementById('nyk-fcap').value || '').trim();
      var sh = !!(document.getElementById('nyk-fshare') && document.getElementById('nyk-fshare').checked);
      req('/api/forum/publish', { method: 'POST', body: JSON.stringify({ email: S.email, token: S.token, work_id: +b.getAttribute('data-id'), caption: cap, share_prompt: sh }) }).then(function (x) {
        if (!x || !x.ok) { toast((x && x.error) || 'Не получилось'); return; }
        (S.works || []).forEach(function (w) { if (String(w.id) === b.getAttribute('data-id')) w.forum_id = x.post_id; });
        toast('Работа в ленте');
        location.href = LENTA_URL;
      }).catch(function () { toast('Нет связи с сервером'); });
      return;
    }
    if ((b && b.getAttribute('data-a') === 'vclose') || e.target.id === 'nyk-view') { this.classList.remove('on'); this.innerHTML = ''; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var v = document.getElementById('nyk-view'); v.classList.remove('on'); v.innerHTML = ''; } });
  // ссылки на эту же страницу (меню шапки: пополнить, мои работы, история) — переключаем без перезагрузки
  document.addEventListener('click', function (e) {
    var pop = document.getElementById('nyk-emopop');
    if (pop && pop.classList.contains('on') && !e.target.closest('#nyk-emopop') && !e.target.closest('[data-a="mailemo"]') && !e.target.closest('[data-a="mailstick"]')) {
      pop.classList.remove('on');
    }
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
    var u; try { u = new URL(a.href, location.href); } catch (x) { return; }
    if (u.origin !== location.origin || u.pathname.replace(/\/+$/, '') !== location.pathname.replace(/\/+$/, '')) return;
    if (!S.acc) return;
    e.preventDefault();
    var q = new URLSearchParams(u.search), t = ({ history: 'hist', istoriya: 'hist', settings: 'set', works: 'works', raboty: 'works', posts: 'wall', posty: 'wall', storage: 'store', support: 'support', gift: 'gift', promo: 'gift', notes: 'notes', signal: 'notes', ref: 'ref', invite: 'ref', friends: 'mates', mates: 'mates', mail: 'mail', dm: 'mail' })[q.get('tab')];
    S.pay = !!q.get('pay'); S.tab = t || (S.pay ? 'over' : 'over');
    if (S.tab === 'notes') { loadNotes(true); window.scrollTo(0, 0); try { history.replaceState(null, '', u.pathname + u.search); } catch (x) {} return; }
    draw(); window.scrollTo(0, 0);
    try { history.replaceState(null, '', u.pathname + u.search); } catch (x) {}
  }, true);
  // если вошли или вышли в другой вкладке (например, в ИИ-сервисах) — обновляем кабинет
  window.addEventListener('storage', function (e) {
    if (e.key !== 'nyt_token') return;
    S.token = e.newValue || ''; S.email = ls('nyt_email') || S.email;
    S.works = null; S.acc = null;
    load();
  });

  if (params.get('reset')) resetView(params.get('reset')); else load();
})();
