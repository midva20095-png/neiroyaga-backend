.vb-q8m-logo__flash{position:absolute;inset:-18px;z-index:1;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(0,255,224,.5),rgba(255,45,149,.3) 40%,transparent 70%)}

  animation:vb-q8mSpark .8s cubic-bezier(.22,1,.36,1) var(--sd,0ms) forwards;opacity:0}
.vb-q8m-logo.is-on .vb-q8m-logo__core{animation:vb-q8mShake .45s cubic-bezier(.36,.07,.19,.97) both}
.vb-q8m-logo.is-on .vb-q8m-emblem{animation:vb-q8mSpinIn .8s cubic-bezier(.34,1.5,.64,1)}

@media (hover:hover){.vb-q8m-logo:hover .vb-q8m-emblem__ring{animation-duration:1.2s}.vb-q8m-logo:hover .vb-q8m-emblem__orbit{animation-duration:1.6s}}

/* ── Навигация (компьютер) ── */

  background:conic-gradient(from var(--vb-q8m-ang),#00ffe0,#b366ff,#ff2d95,#ffcc33,#00ffe0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:vb-q8mAng 4s linear infinite}

.vb-q8m-cab:hover,.vb-q8m-cab:focus-visible{transform:translateY(-2px);box-shadow:0 8px 30px rgba(179,102,255,.45),0 0 26px rgba(0,255,224,.25)}

/* выпадающее меню кабинета */
.vb-q8m-cabwrap{position:relative;flex:none}
.vb-q8m-cabwrap::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px}
.vb-q8m-menu{position:absolute;right:0;top:calc(100% + 12px);z-index:30;min-width:240px;padding:8px;border-radius:18px;

  border:1px solid rgba(179,102,255,.35);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 30px rgba(179,102,255,.18);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top right;
  transition:opacity .2s ease,transform .3s cubic-bezier(.34,1.56,.64,1),visibility .2s}
.vb-q8m-menu::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,#00ffe0,#ff2d95,transparent)}

.vb-q8m-cabwrap:hover .vb-q8m-cab__chev,.vb-q8m-cabwrap:focus-within .vb-q8m-cab__chev{transform:rotate(180deg)}
.vb-q8m-menu__a{display:flex;align-items:center;gap:11px;padding:8px 12px 8px 8px;border-radius:12px;font-size:14px;font-weight:700;color:#eef0ff;outline:none;transition:background-color .2s,color .2s}

/* ── Шторка-меню ── */
.vb-q8m-dim{position:fixed;inset:0;z-index:19998;background:rgba(3,3,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}

.vb-q8m-curtain{
  position:fixed;left:0;right:0;top:var(--vb-q8m-h,58px);z-index:19999;
  max-height:calc(100vh - var(--vb-q8m-h,58px) - 12px);max-height:calc(100dvh - var(--vb-q8m-h,58px) - 12px);overflow-y:auto;overscroll-behavior:contain;
  padding:14px 14px 16px;border-radius:0 0 26px 26px;
  background:rgba(10,10,30,.95);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.08);border-top:0;box-shadow:0 24px 50px rgba(0,0,0,.65),0 0 40px rgba(255,45,149,.1);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#f2f4ff;-webkit-font-smoothing:antialiased;
  transform:translateY(-16px);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .3s ease,visibility .3s;
}
.vb-q8m-curtain.is-open{transform:none;opacity:1;visibility:visible}
.vb-q8m-curtain__list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}

.vb-q8m-tile a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:88px;padding:12px 4px 10px;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 28%,transparent),transparent 65%),linear-gradient(170deg,#191940,#0e0e28);
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 8px 20px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.vb-q8m-tile a:active{transform:scale(.93);box-shadow:0 0 26px color-mix(in srgb,var(--c) 50%,transparent)}

.vb-q8m-tile--wide a{flex-direction:row;min-height:64px;gap:12px}
.vb-q8m-tile--wide .vb-q8m-tile__label{font-size:14px;font-weight:800}
.vb-q8m-tile__icon{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;color:#08081a;
  background:linear-gradient(135deg,var(--c),var(--c2,var(--c)));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.vb-q8m-tile__icon svg{width:23px;height:23px;fill:none}
.vb-q8m-tile__icon .vb-q8m-vk{fill:currentColor}
.vb-q8m-tile__label{font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;color:rgba(255,255,255,.9)}
.vb-q8m-ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.28);transform:scale(0);animation:vb-q8mTap .55s ease-out forwards}
@media (max-width:420px){.vb-q8m-curtain__list{grid-template-columns:repeat(3,1fr)}}
@media (min-width:861px){.vb-q8m-curtain,.vb-q8m-dim{display:none !important}}

/* ═══ Анимации ═══ */
@keyframes vb-q8mDrop{from{transform:translateY(-100%)}}
@keyframes vb-q8mLine{to{background-position:-200% 0}}
@keyframes vb-q8mAng{to{--vb-q8m-ang:360deg}}
@keyframes vb-q8mBgMove{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes vb-q8mShake{15%{transform:translate(-4px,1px) skewX(-3deg)}30%{transform:translate(5px,-1px) skewX(3deg)}45%{transform:translate(-3px,1px)}60%{transform:translate(2px,0)}}
@keyframes vb-q8mSpinIn{40%{transform:rotate(200deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
@keyframes vb-q8mGlitchA{0%,100%{opacity:0}20%{opacity:1;transform:translate(-3px,1px);clip-path:inset(10% 0 60% 0)}50%{opacity:1;transform:translate(3px,-1px);clip-path:inset(55% 0 10% 0)}80%{opacity:.6;transform:translate(-1px,0);clip-path:inset(30% 0 40% 0)}}
@keyframes vb-q8mGlitchB{0%,100%{opacity:0}25%{opacity:1;transform:translate(3px,-1px);clip-path:inset(60% 0 5% 0)}55%{opacity:1;transform:translate(-3px,1px);clip-path:inset(5% 0 70% 0)}}
@keyframes vb-q8mFlash{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
@keyframes vb-q8mSpark{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1 * var(--dist)))}}
@keyframes vb-q8mPing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes vb-q8mSpin{to{transform:rotate(360deg)}}
@keyframes vb-q8mSpinR{to{transform:rotate(-360deg)}}
@keyframes vb-q8mEye{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes vb-q8mRipple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}

.nyl-h{display:flex;align-items:center;gap:10px;padding:12px}
.nyl-h b{cursor:pointer}
#nyl .nyl-fn-neon,#nyl h2.nyl-fn-neon,#nyl .nyl-cap.nyl-fn-neon{font-family:Unbounded,sans-serif!important;letter-spacing:.04em}
#nyl .nyl-fn-serif,#nyl h2.nyl-fn-serif,#nyl .nyl-cap.nyl-fn-serif{font-family:Georgia,"Times New Roman",serif!important;letter-spacing:0}
#nyl .nyl-fn-mono,#nyl h2.nyl-fn-mono,#nyl .nyl-cap.nyl-fn-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;letter-spacing:0}
#nyl .nyl-fn-glow,#nyl h2.nyl-fn-glow,#nyl .nyl-cap.nyl-fn-glow{font-family:Unbounded,sans-serif!important;color:#fff!important;text-shadow:0 0 8px #ff2d95,0 0 18px #00ffe0!important}
.nyl-h time,.nyl-dim{color:var(--dim);font-size:13px}
.nyl-av{width:42px;height:42px;border-radius:50%;overflow:visible;display:flex;align-items:center;justify-content:center;background:#b366ff;background:linear-gradient(135deg,var(--pink),var(--vio));font:800 15px/1 Unbounded,sans-serif;flex-shrink:0}
.nyl-av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
#nyl img.nyl-m,#nyl video.nyl-m{width:100%;max-height:640px;object-fit:contain;background:#070712;display:block}
.nyl-cap{margin:0;padding:6px 14px 0;white-space:pre-wrap}
.nyl-acts{display:flex;align-items:center;gap:2px;padding:4px 8px 0}
#nyl .nyl-ico{border:0!important;background:transparent!important;box-shadow:none!important;color:#f4f1ff!important;min-height:40px;padding:8px 10px!important;width:auto!important;font-weight:700}
#nyl .nyl-ico.on{color:var(--pink)!important}
#nyl .nyl-repeat{display:flex!important;width:auto!important;margin:10px 14px 0;min-height:42px;padding:0 16px;border:0!important;border-radius:14px;justify-content:center;align-items:center;background:#ff2d95;background:linear-gradient(90deg,#ff2d95,#b366ff);color:#fff!important;font-weight:800}
.nyl-model{margin:10px 14px 0;color:#00ffe0;font-size:13px;font-weight:800}
.nyl-com{margin:8px 14px 0;font-size:15px}
.nyl-com.reply{margin-left:28px;padding-left:10px;border-left:2px solid var(--vio)}
#nyl .nyl-com button,#nyl .nyl-morec{background:none!important;border:0!important;box-shadow:none!important;color:var(--cyan)!important;width:auto!important;padding:0!important;font-weight:800;min-height:0}
#nyl .nyl-morec{display:block;margin:8px 14px 0;font-size:14px}
.nyl-form{display:flex;gap:8px;margin:8px 14px 0}
.nyl-form input,.nyl-in{flex:1;width:100%;min-height:46px;background:#070712;border:1px solid rgba(179,102,255,.4);border-radius:14px;padding:12px;outline:none;font-size:16px;color:#f4f1ff}
#nyl .nyl-form button{width:72px!important;min-height:46px;border:0!important;border-radius:14px;background:rgba(0,255,224,.12)!important;color:var(--cyan)!important;font-weight:800;box-shadow:none!important}
.nyl-hero{margin:0 16px 16px;padding-bottom:12px;border:1px solid rgba(179,102,255,.28);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03)}
.nyl-cover{height:auto;aspect-ratio:1600/520;background:#14081f center/cover no-repeat}
@keyframes nyk-shift{0%{background-position:0% 40%}100%{background-position:100% 60%}}
.nyk-cs{background-size:240% 240%;background-repeat:no-repeat}
.nyk-cs-night{background-image:linear-gradient(115deg,#070b18,#1a1038 50%,#101828)}
.nyk-cs-neon{background-image:linear-gradient(100deg,#240018,#ff2d95 42%,#7a2bff 62%,#00ffe0)}
.nyk-cs-dusk{background-image:linear-gradient(120deg,#1a0a22,#c2410c 40%,#7c3aed)}
.nyk-cs-grid{background-color:#070716;background-image:linear-gradient(rgba(0,255,224,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,45,149,.28) 1px,transparent 1px);background-size:28px 28px}
.nyk-cs-ember{background-image:radial-gradient(circle at 20% 80%,#ff2d95,transparent 42%),radial-gradient(circle at 80% 20%,#ff7a18,transparent 40%),linear-gradient(#14010c,#2a0618)}
.nyk-cs-pulse{background-image:linear-gradient(120deg,#ff2d95,#5b21b6,#00ffe0,#ff2d95);animation:nyk-shift 6s ease-in-out infinite alternate}
.nyk-cs-aurora{background-image:linear-gradient(120deg,#042f2e,#22d3ee,#a855f7,#042f2e);animation:nyk-shift 9s ease-in-out infinite alternate}
.nyk-cs-wave{background-image:linear-gradient(180deg,#041428,#00ffe0 40%,#041428 70%);animation:nyk-shift 5s ease-in-out infinite alternate}
.nyk-cs-laser{background-image:linear-gradient(90deg,#0a0a1a 30%,#ff2d95 50%,#0a0a1a 70%);animation:nyk-shift 3s linear infinite alternate}
.nyk-cs-orbit{background-image:conic-gradient(from 90deg,#ff2d95,#00ffe0,#7c3aed,#ff2d95);animation:nyk-shift 10s linear infinite}
.nyk-cs-matrix{background-image:linear-gradient(#001408,#00ff88 50%,#001408);animation:nyk-shift 4s linear infinite alternate}
.nyk-cs-storm{background-image:linear-gradient(160deg,#0b1220,#60a5fa,#1e1b4b);animation:nyk-shift 2.5s ease-in-out infinite alternate}
.nyk-cs-candy{background-image:linear-gradient(120deg,#fb7185,#fde68a,#67e8f9,#c4b5fd);animation:nyk-shift 8s ease-in-out infinite alternate}
.nyk-cs-comet{background-image:linear-gradient(135deg,#020617 20%,#e0f2fe 48%,#020617 62%);animation:nyk-shift 3.5s linear infinite alternate}
.nyk-cs-holo{background-image:linear-gradient(90deg,#f472b6,#22d3ee,#a3e635,#fbbf24,#f472b6);animation:nyk-shift 7s linear infinite}
.nyk-cs-vortex{background-image:radial-gradient(circle,#00ffe0,#5b21b6 40%,#0a0a1a 70%);animation:nyk-shift 8s ease-in-out infinite alternate}
.nyk-cs-spark{background-image:radial-gradient(circle at 30% 40%,#fde68a,transparent 20%),radial-gradient(circle at 70% 60%,#fff,transparent 16%),linear-gradient(#1a1030,#3b0764);animation:nyk-shift 5s ease-in-out infinite alternate}
.nyk-cs-tide{background-image:linear-gradient(120deg,#042f2e,#14b8a6,#67e8f9,#042f2e);animation:nyk-shift 9s ease-in-out infinite alternate}
.nyk-cs-royal{background-image:linear-gradient(120deg,#1c0a2e,#eab308,#7c3aed);animation:nyk-shift 8s ease-in-out infinite alternate}
.nyk-cs-glitch{background-image:linear-gradient(90deg,#ff2d95 0 33%,#00ffe0 33% 66%,#b366ff 66%);animation:nyk-shift 1.2s steps(3) infinite alternate}
.nyk-cs-bloom{background-image:radial-gradient(circle at 50% 60%,#ff8ad4,transparent 45%),linear-gradient(#2a0a22,#4c0519);animation:nyk-shift 7s ease-in-out infinite alternate}
.nyk-cs-circuit{background-color:#031018;background-image:linear-gradient(rgba(0,255,224,.45) 2px,transparent 2px),linear-gradient(90deg,rgba(0,255,224,.45) 2px,transparent 2px);background-size:22px 22px;animation:nyk-shift 6s linear infinite}
.nyk-cs-nova{background-image:radial-gradient(circle,#fff 0,#ff2d95 18%,#1e1b4b 55%);animation:nyk-shift 4s ease-in-out infinite alternate}
.nyk-cs-silk{background-image:linear-gradient(120deg,#fbcfe8,#ddd6fe,#a5f3fc,#fbcfe8);animation:nyk-shift 12s ease-in-out infinite alternate}
.nyk-cs-flare{background-image:radial-gradient(circle at 70% 30%,#fde047,transparent 28%),linear-gradient(160deg,#7f1d1d,#ff2d95,#0a0a1a);animation:nyk-shift 5s ease-in-out infinite alternate}
.nyk-cs-cakes{background-image:radial-gradient(circle at 16% 48%,#fff8ec 0 17%,transparent 18%),radial-gradient(circle at 46% 42%,#ff4d7a 0 20%,transparent 21%),radial-gradient(circle at 74% 56%,#6b3410 0 13%,transparent 14%),radial-gradient(circle at 30% 70%,#ffd166 0 15%,transparent 16%),linear-gradient(105deg,#ffd6e4,#fff3d6 55%,#ffb3c9);background-size:150% 150%;animation:nyk-shift 9s ease-in-out infinite alternate}
.nyk-cs-tort{background-image:radial-gradient(circle at 50% 46%,#fff6e8 0 22%,transparent 23%),radial-gradient(circle at 50% 46%,transparent 22%,#c2410c 23% 28%,transparent 29%),radial-gradient(circle at 28% 38%,#f43f5e 0 8%,transparent 9%),radial-gradient(circle at 70% 36%,#fbbf24 0 8%,transparent 9%),linear-gradient(160deg,#3b0764,#9d174d 45%,#f59e0b);background-size:140% 140%;animation:nyk-shift 8s ease-in-out infinite alternate}
.nyk-cs-petals{background-image:radial-gradient(circle at 12% 40%,#fff 0 7%,transparent 8%),radial-gradient(circle at 28% 62%,#fb7185 0 9%,transparent 10%),radial-gradient(circle at 48% 34%,#fff 0 6%,transparent 7%),radial-gradient(circle at 66% 58%,#f9a8d4 0 10%,transparent 11%),radial-gradient(circle at 84% 40%,#fff 0 7%,transparent 8%),linear-gradient(120deg,#4c1d95,#ec4899 48%,#fda4af);background-size:160% 160%;animation:nyk-shift 11s ease-in-out infinite alternate}
.nyk-cs-roses{background-image:radial-gradient(circle at 22% 50%,#fecdd3 0 16%,transparent 17%),radial-gradient(circle at 55% 42%,#9f1239 0 18%,transparent 19%),radial-gradient(circle at 82% 58%,#fb7185 0 14%,transparent 15%),linear-gradient(130deg,#4a044e,#be123c 50%,#fda4af);background-size:155% 155%;animation:nyk-shift 10s ease-in-out infinite alternate}
.nyk-cs-balloons{background-image:radial-gradient(circle at 18% 55%,#fb7185 0 12%,transparent 13%),radial-gradient(circle at 40% 32%,#38bdf8 0 11%,transparent 12%),radial-gradient(circle at 62% 62%,#fde047 0 12%,transparent 13%),radial-gradient(circle at 82% 38%,#a78bfa 0 11%,transparent 12%),linear-gradient(165deg,#1e1b4b,#312e81 40%,#0ea5e9);background-size:150% 150%;animation:nyk-shift 7s ease-in-out infinite alternate}
.nyk-cs-hearts{background-image:radial-gradient(circle at 30% 50%,#fff 0 8%,#fb7185 9% 16%,transparent 17%),radial-gradient(circle at 70% 46%,#ffe4e6 0 7%,#e11d48 8% 15%,transparent 16%),linear-gradient(115deg,#831843,#e11d48 42%,#fb7185 70%,#fda4af);background-size:160% 160%;animation:nyk-shift 8s ease-in-out infinite alternate}
.nyk-cs-sweets{background-image:repeating-linear-gradient(102deg,#fb7185 0 22px,#fde68a 22px 44px,#67e8f9 44px 66px,#f9a8d4 66px 88px,#fff 88px 100px);background-size:220% 220%;animation:nyk-shift 7s linear infinite}
.nyk-cs-garden{background-image:radial-gradient(circle at 78% 28%,#fef08a 0 14%,transparent 15%),radial-gradient(circle at 22% 62%,#86efac 0 16%,transparent 17%),radial-gradient(circle at 52% 48%,#4ade80 0 10%,transparent 11%),linear-gradient(145deg,#14532d,#16a34a 40%,#65a30d 70%,#f59e0b);background-size:155% 155%;animation:nyk-shift 10s ease-in-out infinite alternate}
@keyframes nyk-pan{0%{background-size:132%;background-position:center 20%}100%{background-size:158%;background-position:center 62%}}
.nyk-cs[class*="hero-"]{background-repeat:no-repeat!important;animation:nyk-pan 18s ease-in-out infinite alternate!important}

.nyl-cover.nyk-cs[class*="hero-"] + .nyl-who .nyl-av{animation:nyk-bob 4.8s ease-in-out infinite;box-shadow:0 0 0 3px rgba(255,45,149,.75),0 0 22px rgba(0,255,224,.45)}
@keyframes nyk-bob{50%{transform:translateY(-6px)}}
.nyl-who{display:flex;align-items:flex-end;gap:16px;padding:0 16px;margin-top:-40px}
.nyl-who .nyl-av{width:96px;height:96px;border:4px solid #0a0a1a;font-size:32px}
.nyl-stats{display:flex;flex:1;justify-content:space-around;padding-bottom:10px}
.nyl-stats div{text-align:center}
.nyl-stats b{display:block;font:800 20px/1.1 Unbounded,sans-serif}
.nyl-stats span{color:var(--dim);font-size:12px}
.nyl-hero h2{margin:10px 16px 4px;font:800 28px/1.1 Unbounded,sans-serif}
.nyl-album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 16px 16px}
.nyl-album figure{margin:0;position:relative}
#nyl .nyl-album button{width:100%!important;aspect-ratio:1;padding:0!important;border:0!important;border-radius:12px;overflow:hidden;background:#070712!important;box-shadow:none!important}
.nyl-album img{width:100%;height:100%;object-fit:cover;display:block}
#nyl .nyl-album .nyl-x{position:absolute;right:4px;bottom:4px;width:auto!important;aspect-ratio:auto;min-height:0;padding:2px 6px!important;border-radius:8px;background:rgba(0,0,0,.65)!important;color:#fff!important;font-size:11px}
.nyl-hero .nyl-row{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 0}
.nyl-addr{display:flex;align-items:center;gap:8px;margin:8px 16px 0;min-height:42px;padding:0 6px 0 14px;border-radius:12px;border:1px solid rgba(0,255,224,.35);background:#070712;color:#d7d2e6;font-size:14px}
.nyl-addr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nyl .nyl-addr button{width:auto!important;min-height:32px;padding:0 12px!important;border:0!important;border-radius:9px;background:rgba(0,255,224,.12)!important;color:#00ffe0!important;font-weight:800;box-shadow:none!important}
#nyl .nyl-thread{display:flex;align-items:center;gap:12px;width:calc(100% - 24px)!important;max-width:760px;margin:0 auto 8px;padding:12px!important;border:0!important;border-radius:16px;background:rgba(255,255,255,.04)!important;color:#f4f1ff!important;text-align:left;box-shadow:none!important}
#nyl .nyl-thread .nyl-av{width:48px;height:48px;flex:none;font-size:18px}
#nyl .nyl-thread .txt{flex:1;min-width:0}
#nyl .nyl-thread .txt b{display:block;width:auto!important;border:0!important;background:none!important;box-shadow:none!important;color:#fff!important;padding:0!important;font-size:16px}
#nyl .nyl-thread .txt small{display:block;color:#a99cc4;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nyl .nyl-thread time{flex:none;color:#8d82a8;font-size:12px}
#nyl .nyl-thread.new{background:rgba(0,255,224,.07)!important}
#nyl .nyl-dmname{background:none!important;border:0!important;box-shadow:none!important;color:#00ffe0!important;width:auto!important;padding:0!important;font-weight:800}
#nyl .nyl-go{flex:1;min-height:46px;border:0!important;border-radius:14px;background:#ff2d95;background:linear-gradient(90deg,#ff2d95,#b366ff);color:#fff!important;font-weight:800}
#nyl .nyl-go.ghost{background:transparent!important;border:1px solid rgba(0,255,224,.45)!important;color:var(--cyan)!important;box-shadow:none!important}
.nyl-search{display:flex;gap:8px;margin:8px 16px 0}
#nyl .nyl-search input{flex:1;min-height:40px;background:#070712;border:1px solid rgba(179,102,255,.4);border-radius:14px;padding:8px 12px;font-size:15px;color:#f4f1ff}
#nyl .nyl-search button{width:auto!important;min-width:72px;min-height:40px;border:0!important;border-radius:14px;background:#ff2d95;background:linear-gradient(90deg,#ff2d95,#b366ff);color:#fff!important;font-weight:800}
@media (min-width:1080px){#nyl .nyl-feed>.nyl-search,#nyl .nyl-supline{display:none}}
.nyl-supline{margin:8px 16px 0}
#nyl .nyl-supline .nyl-prow{width:100%!important;border:1px solid rgba(0,255,224,.35)!important;border-radius:14px;padding:8px 10px!important;background:rgba(0,255,224,.06)!important}
.nyl-support small{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:999px;background:rgba(0,255,224,.16);color:#00ffe0;font-size:11px;font-weight:800}
.nyl-sidesearch{margin:0}
#nyl .nyl-sidecard .nyl-sidesearch input{min-height:40px}
#nyl .nyl-tool{position:relative;width:40px!important;height:40px;border:0!important;border-radius:12px;background:transparent!important;color:#fff!important;box-shadow:none!important;font-size:18px;padding:0!important}
#nyl .nyl-tool i{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#ff2d95;color:#fff;font:700 10px/16px Manrope,sans-serif}
#nyl-emo{position:fixed;z-index:80;width:min(320px,92vw);background:#12081c;border:1px solid rgba(179,102,255,.45);border-radius:16px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
#nyl-emo[hidden]{display:none!important}
#nyl-emo .nyl-emoscroll{max-height:260px;overflow-y:auto!important;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#nyl-emo .nyl-std,#nyl-emo .nyl-vipo{display:flex;flex-wrap:wrap;gap:2px}
#nyl-emo .nyl-std button,#nyl-emo .nyl-vipo button{width:34px!important;height:34px;border:0!important;background:transparent!important;box-shadow:none!important;font-size:20px;padding:0!important;cursor:pointer}
#nyl-emo .nyl-vipo button{width:44px!important;height:44px;font-size:26px;border-radius:12px;background:linear-gradient(145deg,rgba(255,45,149,.22),rgba(0,255,224,.12))!important;box-shadow:inset 0 0 0 1px rgba(255,215,106,.4)!important}
#nyl-emo .nyl-emolock{margin:8px 2px 6px;color:#ffe9a8;font-size:12px;font-weight:800}
#nyl-emo.stick{width:min(280px,92vw)}
#nyl-emo.stick .nyl-std{display:flex}
#nyl-emo.stick .nyl-std button{width:52px!important;height:52px;font-size:32px;background:transparent!important}
#nyl .nyl-emo{width:44px!important;min-height:46px;border:0!important;background:transparent!important;box-shadow:none!important;font-size:22px;padding:0!important}
.nyl-nfilters{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px}
#nyl .nyl-nfilters button{width:auto!important;border-radius:999px;padding:7px 12px!important;border:1px solid rgba(179,102,255,.4)!important;background:transparent!important;color:#cfc6e6!important;box-shadow:none!important;white-space:nowrap}
#nyl .nyl-nfilters button.on{color:#00ffe0!important;border-color:#00ffe0!important}
#nyl .nyl-nrow{display:flex;align-items:center;gap:12px;width:calc(100% - 24px)!important;margin:0 12px 8px;padding:12px!important;border:0!important;border-radius:16px;background:rgba(255,255,255,.04)!important;color:#f4f1ff!important;text-align:left;box-shadow:none!important}
#nyl .nyl-nrow.new{background:rgba(0,255,224,.07)!important}
.nyl-nico{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#1b1430;border:1px solid rgba(179,102,255,.35)}
.nyl-nrow .txt{flex:1;min-width:0}
.nyl-nrow .txt b{display:block;color:#fff;font-size:15px}
.nyl-nrow .txt small,.nyl-nrow .txt em{display:block;color:#a99cc4;font-size:13px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nyl-nrow time{flex:none;align-self:flex-start;color:#8d82a8;font-size:12px}
#nyl .nyl-dock button{position:relative}
.nyl-nbadge{position:absolute;top:2px;right:12%;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#ff2d95;color:#fff;font:700 10px/16px Manrope,sans-serif;text-align:center}
.nyl-nbadge[hidden]{display:none!important}
.nyl-login{max-width:420px;margin:12px auto;padding:8px 18px 28px}
.nyl-login h2{margin:12px 0 6px;font:800 28px/1 Unbounded,sans-serif}
.nyl-login .nyl-in{display:block;margin:0 0 10px}
