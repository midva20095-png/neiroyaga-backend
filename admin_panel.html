<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>НейроЯга · Админ-панель</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0614;--p1:#140c24;--p2:#1c1233;--tx:#f3efff;--mut:#a79cc4;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--cy:#00d4ff;--pu:#9d4dff;--pk:#ff2ec4;--ok:#3ee08f;--grad:linear-gradient(135deg,#00d4ff,#9d4dff 50%,#ff2ec4)}
body{margin:0;background:radial-gradient(60% 40% at 10% 0,rgba(0,212,255,.1),transparent 60%),radial-gradient(50% 40% at 90% 0,rgba(255,46,196,.1),transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--cy)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:20px;flex:1}
.top h1 i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{padding:11px 18px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700}
.btn:disabled{opacity:.5}
.ghost{padding:9px 14px;border-radius:12px;border:1px solid var(--ln2);font-weight:600}
.ghost:hover{border-color:var(--pu)}
.danger{border-color:rgba(255,80,120,.6);color:#ff9fb8}
.in{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--ln2);background:var(--p1);outline:none}
.in:focus{border-color:var(--pu)}
.card{background:rgba(255,255,255,.03);border:1px solid var(--ln2);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--p1);border:1px solid var(--ln2);border-radius:16px;padding:14px}
.kpi small{color:var(--mut);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:2px}
.kpi.hot{border-color:rgba(255,46,196,.5);background:linear-gradient(135deg,rgba(255,46,196,.12),rgba(157,77,255,.08))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:12px;border:1px solid var(--ln2);color:var(--mut);font-weight:700}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12.5px}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(157,77,255,.08)}
.tbl{overflow-x:auto}
.p{color:var(--ok);font-weight:700}.m{color:#ff8be0;font-weight:700}
.dim{color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--grad);min-height:2px}
.chart span{font-size:10.5px;color:var(--mut)}
.chart em{font-style:normal;font-size:10.5px;color:var(--tx)}
.bar{display:grid;grid-template-columns:minmax(72px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.bar div{height:9px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.bar div i{display:block;height:100%;background:var(--grad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .in{flex:1;min-width:140px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.tag.vip{background:linear-gradient(135deg,#ffd76a,#ff9f43);color:#3a1d00}
.tag.on{background:rgba(62,224,143,.2);color:#9ff5c8}
.hint{margin:-6px 0 14px}
.drop{display:block;margin-top:6px;border:1px dashed rgba(0,212,255,.55);border-radius:16px;background:#120a22;cursor:pointer;overflow:hidden;text-align:center}
.drop input{display:none}
.drop .pad{padding:28px 16px;font-weight:800}
.drop img{width:100%;max-height:320px;object-fit:cover;object-position:center top;display:block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tcard{background:#140c24;border:1px solid var(--ln2);border-radius:16px;overflow:hidden}
.tcard.off{opacity:.62}
.tcard img,.tcard .ph{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:linear-gradient(150deg,#22164a,#0d2b3a)}
.tbody{padding:10px 12px 12px}
.tbody b{display:block}
.chk{display:flex;align-items:center;gap:6px;font-weight:600}
.login{max-width:400px;margin:12vh auto 0;text-align:center}
.login p{color:var(--mut)}
.code{font-size:28px;letter-spacing:.35em;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#231842;border:1px solid var(--ln2);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;z-index:9}
.toast.on{opacity:1}
.pw{font:700 20px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.08em;background:var(--p1);border:1px dashed var(--pu);border-radius:12px;padding:10px 14px;margin:8px 0;user-select:all}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{flex-wrap:wrap}}
@media(max-width:560px){.wrap{padding:12px 10px calc(28px + env(safe-area-inset-bottom,0px))}.grid{grid-template-columns:1fr 1fr}.top h1{font-size:18px}.login{margin-top:6vh;padding:0 8px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var T = sessionStorage.getItem('ny_admin') || '';
  var S = { tab: 'sum', q: '', user: null, tplShow: 'all', tplPhoto: '', tplPhotoTouched: false };
  var HINT = {
    sum: 'Деньги, новые клиенты и что они покупают.',
    users: 'Баланс, VIP, пароль и чёрный список. Нажмите строку клиента.',
    tpl: 'Карточки чата. Зелёная метка «На сайте» — человек это видит. «Скрыт» — только у вас.',
    forum: 'Работы людей в ленте. Скрыть убирает с сайта, стереть удаляет совсем.',
    hall: 'Общий чат ленты.',
    promo: 'Коды на кредиты и бонус к пополнению.'
  };
  var CAT = { chat: '💬 Чат', image: '🎨 Картинки', template: '✨ Шаблоны', video: '🎬 Видео', audio: '🎵 Музыка', storage: '💾 Хранилище', other: '• Прочее' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(v) { return String(Math.round(v || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function dt(iso) { if (!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
  var tt; function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 3500); }

  function api(path, body) {
    var opt = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Admin-Token': T } };
    if (body) opt.body = JSON.stringify(body);
    return fetch(path, opt).then(function (r) {
      if (r.status === 401) { T = ''; sessionStorage.removeItem('ny_admin'); login(); throw new Error('auth'); }
      return r.json();
    });
  }

  /* ---------- вход ---------- */
  function login(msg) {
    app.innerHTML = '<div class="login card"><h2 style="margin:0 0 8px">🔐 Админ-панель <span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">НейроЯги</span></h2>' +
      '<p>Код для входа придёт в Telegram от бота поддержки.</p>' +
      '<button class="btn" id="getcode" style="width:100%">Получить код в Telegram</button>' +
      '<div id="codebox" style="display:none;margin-top:14px"><input class="in code" id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">' +
      '<button class="btn" id="enter" style="width:100%;margin-top:10px">Войти</button></div>' +
      '<p id="lerr" style="color:#ff9fb8;min-height:20px">' + esc(msg || '') + '</p></div>';
    document.getElementById('getcode').onclick = function () {
      var b = this; b.disabled = true;
      fetch('/api/admin/code', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (r) {
        b.disabled = false;
        if (!r.ok) { document.getElementById('lerr').textContent = r.error || 'Ошибка'; return; }
        b.textContent = 'Отправить код ещё раз';
        document.getElementById('codebox').style.display = 'block'; document.getElementById('code').focus();
        document.getElementById('lerr').textContent = '';
      }).catch(function () { b.disabled = false; document.getElementById('lerr').textContent = 'Нет связи с сервером'; });
    };
    var enter = function () {
      var c = document.getElementById('code').value.trim();
      fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: c }) })
        .then(function (r) { return r.json(); }).then(function (r) {
          if (!r.ok) { document.getElementById('lerr').textContent = r.error || 'Неверный код'; return; }
          T = r.token; sessionStorage.setItem('ny_admin', T); main();
        });
    };
    document.getElementById('enter').onclick = enter;
    document.getElementById('code').onkeydown = function (e) { if (e.key === 'Enter') enter(); };
  }

  /* ---------- каркас ---------- */
  function main() {
    app.innerHTML = '<div class="top"><h1>🛠 Админ-панель <i>НейроЯги</i></h1><button class="ghost" id="logout">Выйти</button></div>' +
      '<div class="tabs"><button data-t="sum">📊 Сводка</button><button data-t="users">👥 Клиенты</button><button data-t="tpl">✨ Шаблоны</button><button data-t="forum">📰 Лента</button><button data-t="hall">💬 Чат</button><button data-t="promo">🎟 Промокоды</button></div><p class="dim hint" id="hint"></p><div id="view"></div>';
    document.getElementById('logout').onclick = function () { sessionStorage.removeItem('ny_admin'); T = ''; login(); };
    app.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { S.tab = b.getAttribute('data-t'); S.user = null; show(); }; });
    show();
  }
  function show() {
    app.querySelectorAll('[data-t]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === S.tab); });
    var hint = document.getElementById('hint');
    if (hint) hint.textContent = S.user ? 'Карточка клиента.' : (HINT[S.tab] || '');
    if (S.user) return userView(S.user);
    if (S.tab === 'sum') summary(); else if (S.tab === 'promo') promos(); else if (S.tab === 'forum') forum(); else if (S.tab === 'hall') hall(); else if (S.tab === 'tpl') siteTemplates(); else users();
  }
  function view(h) { document.getElementById('view').innerHTML = h; }

  /* ---------- сводка ---------- */
  function summary() {
    view('<p class="dim">Загружаю…</p>');
    api('/api/admin/stats').then(function (r) {
      if (!r.ok) { view('<p>' + esc(r.error) + '</p>'); return; }
      var rv = r.revenue, u = r.users;
      var h = '<div class="grid">' +
        '<div class="kpi hot"><small>Выручка сегодня</small><b>' + n(rv.today) + ' ₽</b></div>' +
        '<div class="kpi"><small>За 7 дней</small><b>' + n(rv.d7) + ' ₽</b></div>' +
        '<div class="kpi"><small>За 30 дней</small><b>' + n(rv.d30) + ' ₽</b><small>' + rv.n30 + ' платежей</small></div>' +
        '<div class="kpi"><small>Всего с начала</small><b>' + n(rv.total) + ' ₽</b></div>' +
        '<div class="kpi"><small>Клиентов всего</small><b>' + n(u.total) + '</b><small>активны за 7 дней: ' + n(u.active7) + '</small></div>' +
        '<div class="kpi"><small>Новые: сегодня / 7 / 30 дней</small><b>' + u.d1 + ' / ' + u.d7 + ' / ' + u.d30 + '</b></div>' +
        '<div class="kpi"><small>Кредитов на балансах</small><b>' + n(u.credits) + '</b><small>это ваш долг перед клиентами</small></div>' +
        '<div class="kpi"><small>👑 VIP / 💾 Хранилище</small><b>' + r.vip + ' / ' + r.storage + '</b><small>в поддержке сейчас: ' + r.support_online + '</small></div></div>';
      var mx = Math.max.apply(null, r.days.map(function (d) { return d.s; }).concat([1]));
      h += '<div class="card"><h3>Выручка за 14 дней</h3>' + (r.days.length ? '<div class="chart">' + r.days.map(function (d) {
        return '<div><em>' + (d.s ? n(d.s) : '') + '</em><i style="height:' + Math.max(2, Math.round(d.s / mx * 110)) + 'px"></i><span>' + esc(d.d) + '</span></div>';
      }).join('') + '</div>' : '<p class="dim">Платежей пока нет</p>') + '</div>';
      var cm = Math.max.apply(null, r.categories.map(function (c) { return c.s; }).concat([1]));
      h += '<div class="two"><div class="card"><h3>Траты клиентов за 30 дней</h3>' + (r.categories.length ? r.categories.map(function (c) {
        return '<div class="bar"><span>' + esc(CAT[c.c] || c.c) + '</span><div><i style="width:' + Math.max(3, Math.round(c.s / cm * 100)) + '%"></i></div><b>' + n(c.s) + ' кр.</b></div>';
      }).join('') : '<p class="dim">Пока пусто</p>') + '</div>' +
        '<div class="card"><h3>Популярные шаблоны за 30 дней</h3>' + (r.templates.length ? '<table><tr><th>Шаблон</th><th>Запусков</th><th>Кредитов</th></tr>' + r.templates.map(function (t) {
          return '<tr><td>' + esc(t.t) + '</td><td>' + t.n + '</td><td>' + n(t.s) + '</td></tr>';
        }).join('') + '</table>' : '<p class="dim">Пока пусто</p>') + '</div></div>';
      h += '<div class="card"><h3>Последние платежи</h3><div class="tbl"><table><tr><th>Когда</th><th>Клиент</th><th>Сумма</th><th>Кредитов</th></tr>' +
        (r.payments.map(function (p) { return '<tr class="click" data-u="' + esc(p.email) + '"><td>' + dt(p.at) + '</td><td>' + esc(p.email) + '</td><td class="p">' + n(p.rub) + ' ₽</td><td>' + n(p.credits) + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="dim">Платежей пока нет</td></tr>') +
        '</table></div></div>';
      h += '<p class="dim" style="font-size:12.5px">Бот Telegram: ' + (r.bot ? '✅ подключён' : '❌ не настроен') + ' · Чеки 54-ФЗ: ' + (r.receipts ? '✅ передаются в ЮKassa' : '⚪ не передаются (YOOKASSA_RECEIPT)') + '</p>';
      view(h); bindUsers();
    }).catch(function () {});
  }

  /* ---------- промокоды ---------- */
  function promos() {
    var h = '<div class="card"><h3>➕ Новый промокод</h3>' +
      '<div class="row"><input class="in" id="pc" placeholder="Код, например BLOGER100" style="text-transform:uppercase">' +
      '<select class="in" id="pk" style="max-width:230px"><option value="credits">Кредиты на баланс</option><option value="percent">Бонус % к пополнению</option></select></div>' +
      '<div class="row" style="margin-top:8px"><input class="in" id="pv" type="number" placeholder="Сколько (кр. или %)"><input class="in" id="pm" type="number" placeholder="Сколько раз всего" value="100">' +
      '<input class="in" id="pd" type="number" placeholder="Действует дней (0 — бессрочно)" value="30"><input class="in" id="pn" type="number" placeholder="Только для новых: дней с регистрации (0 — всем)" value="0"></div>' +
      '<div class="row" style="margin-top:8px"><input class="in" id="pnote" placeholder="Заметка: для какого блогера, акции"><button class="btn" id="pgo">Создать</button></div>' +
      '<p class="dim" style="font-size:12.5px;margin:8px 0 0">Каждый клиент может использовать код один раз. Бонус к пополнению — до 50%, действует 7 дней после ввода и срабатывает на ближайшей оплате.</p></div>' +
      '<div id="plist"><p class="dim">Загружаю…</p></div>';
    view(h);
    document.getElementById('pgo').onclick = function () {
      var body = { code: document.getElementById('pc').value.trim(), kind: document.getElementById('pk').value, value: +document.getElementById('pv').value,
        max_uses: +document.getElementById('pm').value, days: +document.getElementById('pd').value, new_only_days: +document.getElementById('pn').value,
        note: document.getElementById('pnote').value.trim() };
      api('/api/admin/promo', body).then(function (x) { toast(x.ok ? 'Создан ' + x.code : x.error); if (x.ok) promos(); });
    };
    api('/api/admin/promos').then(function (r) {
      var h2 = '<div class="card tbl"><h3>Промокоды</h3><table><tr><th>Код</th><th>Даёт</th><th>Использовано</th><th>До</th><th>Условия</th><th></th></tr>' +
        (r.promos.map(function (p) {
          return '<tr><td><b>' + esc(p.code) + '</b>' + (p.note ? '<br><span class="dim" style="font-size:12px">' + esc(p.note) + '</span>' : '') + '</td>' +
            '<td>' + (p.kind === 'credits' ? '+' + n(p.value) + ' кр.' : '+' + p.value + '% к пополнению') + '</td>' +
            '<td>' + p.used + ' / ' + n(p.max_uses) + '</td><td>' + (p.expires || 'бессрочно') + '</td>' +
            '<td class="dim" style="font-size:12.5px">' + (p.new_only_days ? 'новым (до ' + p.new_only_days + ' дн.)' : 'всем') + '</td>' +
            '<td><button class="ghost' + (p.active ? ' danger' : '') + '" data-tg="' + esc(p.code) + '">' + (p.active ? 'Выключить' : 'Включить') + '</button></td></tr>';
        }).join('') || '<tr><td colspan="6" class="dim">Промокодов пока нет</td></tr>') + '</table></div>';
      h2 += '<div class="card tbl"><h3>🎁 Подарочные сертификаты</h3><table><tr><th>Код</th><th>Купил</th><th>Номинал</th><th>Когда</th><th>Активировал</th></tr>' +
        (r.gifts.map(function (g) {
          return '<tr><td style="font-family:ui-monospace,Menlo,monospace">' + esc(g.code) + '</td><td>' + esc(g.buyer) + '</td><td>' + n(g.credits) + ' кр. / ' + n(g.rub) + ' ₽</td><td>' + esc(g.created) + '</td>' +
            '<td>' + (g.used_by ? esc(g.used_by) + '<br><span class="dim" style="font-size:12px">' + esc(g.used) + '</span>' : '<span class="dim">ещё не активирован</span>') + '</td></tr>';
        }).join('') || '<tr><td colspan="5" class="dim">Сертификатов пока не покупали</td></tr>') + '</table></div>';
      document.getElementById('plist').innerHTML = h2;
      document.querySelectorAll('[data-tg]').forEach(function (b) {
        b.onclick = function () { api('/api/admin/promo/toggle', { code: b.getAttribute('data-tg') }).then(function (x) { toast(x.ok ? (x.active ? 'Включён' : 'Выключен') : x.error); promos(); }); };
      });
    }).catch(function () {});
  }

  function hall() {
    view('<div id="hlist"><p class="dim">Загружаю…</p></div>');
    api('/api/admin/hall').then(function (r) {
      var bans = (r.bans || []).map(function (b) {
        return '<tr><td>' + esc(b.nick || '—') + '<br><span class="dim" style="font-size:12px">' + esc(b.email) + '</span></td><td>' + esc(b.at) + '</td><td><button class="ghost" data-unban="' + esc(b.email) + '">Вернуть в чат</button></td></tr>';
      }).join('') || '<tr><td colspan="3" class="dim">Никто не заблокирован</td></tr>';
      var msgs = (r.messages || []).map(function (m) {
        return '<tr><td>' + esc(m.at) + '</td><td>' + esc(m.nick || '—') + (m.banned ? ' <span class="tag" style="background:rgba(255,80,120,.2);color:#ff9fb8">чат закрыт</span>' : '') + '<br><span class="dim" style="font-size:12px">' + esc(m.email) + '</span></td><td>' + esc(m.text) + (m.hidden ? ' <span class="dim">· удалено</span>' : '') + '</td><td><button class="ghost danger" data-hhide="' + m.id + '" data-on="' + (m.hidden ? '0' : '1') + '">' + (m.hidden ? 'Вернуть' : 'Удалить') + '</button> <button class="ghost danger" data-hpurge="' + m.id + '">Стереть</button> <button class="ghost' + (m.banned ? '' : ' danger') + '" data-hban="' + esc(m.email) + '" data-on="' + (m.banned ? '0' : '1') + '">' + (m.banned ? 'Разбанить' : 'Закрыть чат') + '</button></td></tr>';
      }).join('') || '<tr><td colspan="4" class="dim">Сообщений нет</td></tr>';

  /* ---------- шаблоны сайта ---------- */
  function fileToJpeg(file, max, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать фото')); };
      img.src = url;
    });
  }
  function safeImg(u) {
    var s = String(u || '');
    if (/^https?:\/\//i.test(s)) return s;
    if (/^data:image\/(jpeg|jpg|png|webp);base64,/i.test(s)) return s;
    return '';
  }

  }
  function blankTpl() {
    return { id: '', title: '', desc: '', image: '', price: 10, prompt: '', fields: '', cats: '', formats: '3:4', model: 'nanobanana', trend: false, vip: false, active: true, sort: 0, fresh: true };
  }
  function tplPayload(p, extra) {
    var body = {
      id: p.id, title: p.title, desc: p.desc || '', image: p.image || '', price: p.price,
      model: p.model || 'nanobanana', formats: p.formats || '', sort: p.sort || 0, cats: p.cats || '',
      fields: p.fields || '', prompt: p.prompt || '', trend: !!p.trend, vip: !!p.vip, active: !!p.active
    };
    if (extra) Object.keys(extra).forEach(function (k) { body[k] = extra[k]; });
    return body;
  }
  function drawTpls() {
    var t = S.tplForm || blankTpl();
    var catsShown = String(t.cats || '').split(',').map(function (c) { return c.trim(); }).filter(function (c) { return c && c.toLowerCase() !== 'vip'; }).join(', ');
    var preview = safeImg(S.tplPhotoTouched ? S.tplPhoto : t.image);
    var link = (!S.tplPhotoTouched && /^https?:\/\//i.test(t.image || '')) ? t.image : '';
    var published = S.rows.filter(function (p) { return p.active; }).length;
    var hidden = S.rows.length - published;
    var shown = S.rows.filter(function (p) {
      if (S.tplShow === 'on') return !!p.active;
      if (S.tplShow === 'off') return !p.active;
      return true;
    });
    var h = '<div class="card"><h3>' + (t.fresh ? 'Новый шаблон' : 'Правка · ' + esc(t.title || t.id)) + '</h3>' +
      '<p class="dim" style="margin-top:0">Четыре шага. Фото человек видит на карточке. Текст задания видите только вы. Галочка «На сайте» публикует карточку в чат.</p>' +
      '<label>1. Фото-пример</label>' +
      '<label class="drop">' + (preview ? '<img id="tpreview" src="' + esc(preview) + '" alt="">' : '<div class="pad" id="tpad">Нажмите и выберите фото с телефона или компьютера</div>') +
      '<input id="tfile" type="file" accept="image/*"></label>' +
      (preview ? '<button class="ghost" type="button" id="tclear" style="margin-top:8px">Убрать фото</button>' : '') +
      '<label style="display:block;margin-top:12px">2. Название</label><div class="row"><input class="in" id="ttitle" placeholder="Например: Портрет в неоне" value="' + esc(t.title) + '">' +
      '<input class="in" id="tid" placeholder="Код латиницей, например portret" value="' + esc(t.id) + '"' + (t.fresh ? '' : ' readonly') + '></div>' +
      '<label style="display:block;margin-top:12px">3. Что должна сделать нейросеть. Человек это не видит</label>' +
      '<textarea class="in" id="tprompt" rows="6" placeholder="Опишите стиль. Ответы полей пишите как {имя}">' + esc(t.prompt) + '</textarea>' +
      '<label style="display:block;margin-top:12px">Поля для ответов человека. Пусто — шаблон без вопросов</label>' +
      '<textarea class="in" id="tfields" rows="4" placeholder="фото | Ваше фото | до 1&#10;текст | имя | Как вас зовут?&#10;выбор | пол | Пол | Мужской; Женский">' + esc(t.fields) + '</textarea>' +
      '<p class="dim">Каждая строка — одно поле: фото, текст, выбор, дата или число.</p>' +
      '<label>4. Цена и модель</label><div class="row"><input class="in" id="tprice" type="number" placeholder="Цена, кр." value="' + esc(t.price) + '">' +
      '<select class="in" id="tmodel"><option value="nanobanana"' + (t.model === 'nanobanana' ? ' selected' : '') + '>Картинка</option><option value="nanobanana_pro"' + (t.model === 'nanobanana_pro' ? ' selected' : '') + '>Картинка Pro</option><option value="text"' + (t.model === 'text' || t.model === 'текст' ? ' selected' : '') + '>Текст</option></select></div>' +
      '<label class="chk" style="margin-top:12px"><input type="checkbox" id="tactive"' + (t.active ? ' checked' : '') + '> На сайте. Снимите галочку, чтобы спрятать карточку</label>' +
      '<details style="margin-top:12px"' + (t.fresh ? '' : ' open') + '><summary style="cursor:pointer;font-weight:700">Дополнительно: описание, темы, порядок</summary>' +
      '<input class="in" id="tdesc" style="margin-top:8px" placeholder="Короткое описание под названием" value="' + esc(t.desc) + '">' +
      '<input class="in" id="timg" style="margin-top:8px" placeholder="Ссылка на картинку, если фото не загружаете файлом" value="' + esc(link) + '">' +
      '<input class="in" id="tcats" style="margin-top:8px" placeholder="Темы через запятую: Портрет, Праздник" value="' + esc(catsShown) + '">' +
      '<div class="row" style="margin-top:8px"><input class="in" id="tfmt" placeholder="Форматы: 1:1, 3:4, 9:16" value="' + esc(t.formats) + '">' +
      '<input class="in" id="tsort" type="number" placeholder="Порядок. Меньше — выше" value="' + esc(t.sort || 0) + '"></div>' +
      '<div class="row" style="margin-top:8px"><label class="chk"><input type="checkbox" id="ttrend"' + (t.trend ? ' checked' : '') + '> В популярном</label>' +
      '<label class="chk"><input type="checkbox" id="tvip"' + (t.vip ? ' checked' : '') + '> Только VIP</label></div></details>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="tsave">' + (t.fresh ? 'Добавить шаблон' : 'Сохранить') + '</button>' +
      (t.fresh ? '' : '<button class="ghost" id="tnew">Отмена</button>') + '</div></div>';
    h += '<div class="card"><h3>Шаблоны · ' + S.rows.length + '</h3>' +
      '<p class="dim" style="margin-top:0">На сайте ' + published + '. Скрыто ' + hidden + '.</p>' +
      '<div class="tabs" style="margin-bottom:12px"><button type="button" data-show="all"' + (S.tplShow === 'all' ? ' class="on"' : '') + '>Все</button>' +
      '<button type="button" data-show="on"' + (S.tplShow === 'on' ? ' class="on"' : '') + '>На сайте</button>' +
      '<button type="button" data-show="off"' + (S.tplShow === 'off' ? ' class="on"' : '') + '>Скрытые</button></div>' +
      (shown.length ? '<div class="gallery">' + shown.map(function (p) {
        var src = safeImg(p.image);
        return '<article class="tcard' + (p.active ? '' : ' off') + '">' +
          (src ? '<img src="' + esc(src) + '" alt="">' : '<div class="ph"></div>') +
          '<div class="tbody"><b>' + esc(p.title) + '</b><div style="margin:6px 0">' +
          (p.active ? '<span class="tag on">На сайте</span>' : '<span class="tag">Скрыт</span>') +
          (p.vip ? ' <span class="tag vip">VIP</span>' : '') +
          (p.trend ? ' <span class="tag">популярное</span>' : '') + '</div>' +
          '<div><b>' + n(p.price) + ' кр.</b> <span class="dim">· ' + n(p.runs) + ' запусков</span></div>' +
          '<div class="dim" style="font-size:12px;margin-top:4px">' + esc(p.id) + '</div>' +
          '<div class="row" style="margin-top:8px"><button class="ghost" data-ed="' + esc(p.id) + '">Править</button>' +
          '<button class="ghost" data-pub="' + esc(p.id) + '">' + (p.active ? 'Скрыть' : 'На сайт') + '</button>' +
          '<button class="ghost danger" data-del="' + esc(p.id) + '">Удалить</button></div></div></article>';
      }).join('') + '</div>' : '<p class="dim">В этом списке пусто. Загрузите фото, напишите название и нажмите «Добавить шаблон».</p>') +
      '</div>';
    view(h);
    var file = document.getElementById('tfile');
    if (file) file.onchange = function () { onTplPhoto(file); };
    var clear = document.getElementById('tclear');
    if (clear) clear.onclick = function () {
      S.tplPhoto = '';
      S.tplPhotoTouched = true;
      if (S.tplForm) S.tplForm.image = '';
      drawTpls();
    };
    document.querySelectorAll('[data-show]').forEach(function (b) {
      b.onclick = function () { S.tplShow = b.getAttribute('data-show') || 'all'; drawTpls(); };
    });
    var newer = document.getElementById('tnew');
    if (newer) newer.onclick = function () { S.tplForm = blankTpl(); S.tplPhoto = ''; S.tplPhotoTouched = false; drawTpls(); };
    document.getElementById('tsave').onclick = function () {
      var image = S.tplPhotoTouched ? (S.tplPhoto || '') : (document.getElementById('timg').value.trim() || t.image || '');
      var body = {
        id: document.getElementById('tid').value.trim(), title: document.getElementById('ttitle').value.trim(),
        desc: document.getElementById('tdesc').value.trim(), image: image,
        price: +document.getElementById('tprice').value, model: document.getElementById('tmodel').value,
        formats: document.getElementById('tfmt').value.trim(), sort: +document.getElementById('tsort').value,
        cats: document.getElementById('tcats').value.trim(), fields: document.getElementById('tfields').value,
        prompt: document.getElementById('tprompt').value, trend: document.getElementById('ttrend').checked,
        vip: document.getElementById('tvip').checked, active: document.getElementById('tactive').checked
      };
      api('/api/admin/templates', body).then(function (x) {
        toast(x.ok ? (body.active ? 'Шаблон на сайте' : 'Шаблон скрыт') : (x.error || 'Не получилось'));
        if (x.ok) { S.tplForm = blankTpl(); S.tplPhoto = ''; S.tplPhotoTouched = false; siteTemplates(); }
      });
    };
    document.querySelectorAll('[data-ed]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-ed');
        S.tplForm = Object.assign({ fresh: false }, S.rows.filter(function (p) { return p.id === id; })[0] || blankTpl());
        S.tplForm.fresh = false;
        S.tplPhoto = '';
        S.tplPhotoTouched = false;
        drawTpls();
        window.scrollTo(0, 0);
      };
    });
    document.querySelectorAll('[data-pub]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-pub');
        var row = S.rows.filter(function (p) { return p.id === id; })[0];
        if (!row) return;
        api('/api/admin/templates', tplPayload(row, { active: !row.active })).then(function (x) {
          toast(x.ok ? (row.active ? 'Скрыт' : 'На сайте') : (x.error || 'Не получилось'));
          if (x.ok) siteTemplates();
        });
      };
    });
    document.querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-del');
        if (!confirm('Удалить шаблон ' + id + '?')) return;
        api('/api/admin/templates/delete', { id: id }).then(function (x) {
          toast(x.ok ? 'Удалён' : (x.error || 'Не получилось'));
          if (x.ok) {
            if (S.tplForm && S.tplForm.id === id) { S.tplForm = blankTpl(); S.tplPhoto = ''; S.tplPhotoTouched = false; }
            siteTemplates();
          }
        });
      };
    });
  }
  function onTplPhoto(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    fileToJpeg(file, 900, 0.72).then(function (data) {
      if (data.length > 700000) return fileToJpeg(file, 640, 0.66);
      return data;
    }).then(function (data) {
      S.tplPhoto = data;
      S.tplPhotoTouched = true;
      drawTpls();
    }).catch(function (e) { toast(e.message || 'Не удалось прочитать фото'); });
  }

  if (T) main(); else login();
})();
</script>
</body>
</html>
