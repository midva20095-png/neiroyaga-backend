<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>НейроЯга · Админ-панель</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0614;--p1:#140c24;--p2:#1c1233;--tx:#f3efff;--mut:#a79cc4;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--cy:#00d4ff;--pu:#9d4dff;--pk:#ff2ec4;--ok:#3ee08f;--grad:linear-gradient(135deg,#00d4ff,#9d4dff 50%,#ff2ec4)}
body{margin:0;background:radial-gradient(60% 40% at 10% 0,rgba(0,212,255,.1),transparent 60%),radial-gradient(50% 40% at 90% 0,rgba(255,46,196,.1),transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--cy)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:20px;flex:1}
.top h1 i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{padding:11px 18px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700}
.btn:disabled{opacity:.5}
.ghost{padding:9px 14px;border-radius:12px;border:1px solid var(--ln2);font-weight:600}
.ghost:hover{border-color:var(--pu)}
.danger{border-color:rgba(255,80,120,.6);color:#ff9fb8}
.in{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--ln2);background:var(--p1);outline:none}
.in:focus{border-color:var(--pu)}
.card{background:rgba(255,255,255,.03);border:1px solid var(--ln2);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--p1);border:1px solid var(--ln2);border-radius:16px;padding:14px}
.kpi small{color:var(--mut);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:2px}
.kpi.hot{border-color:rgba(255,46,196,.5);background:linear-gradient(135deg,rgba(255,46,196,.12),rgba(157,77,255,.08))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{padding:9px 16px;border-radius:12px;border:1px solid var(--ln2);color:var(--mut);font-weight:700}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12.5px}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(157,77,255,.08)}
.tbl{overflow-x:auto}
.p{color:var(--ok);font-weight:700}.m{color:#ff8be0;font-weight:700}
.dim{color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--grad);min-height:2px}
.chart span{font-size:10.5px;color:var(--mut)}
.chart em{font-style:normal;font-size:10.5px;color:var(--tx)}
.bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.bar div{height:9px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.bar div i{display:block;height:100%;background:var(--grad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .in{flex:1;min-width:140px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.tag.vip{background:linear-gradient(135deg,#ffd76a,#ff9f43);color:#3a1d00}
.tag.on{background:rgba(62,224,143,.2);color:#9ff5c8}
.login{max-width:400px;margin:12vh auto 0;text-align:center}
.login p{color:var(--mut)}
.code{font-size:28px;letter-spacing:.35em;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#231842;border:1px solid var(--ln2);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;z-index:9}
.toast.on{opacity:1}
.pw{font:700 20px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.08em;background:var(--p1);border:1px dashed var(--pu);border-radius:12px;padding:10px 14px;margin:8px 0;user-select:all}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var T = sessionStorage.getItem('ny_admin') || '';
  var S = { tab: 'sum', q: '', user: null };
  var CAT = { chat: '💬 Чат', image: '🎨 Картинки', template: '✨ Шаблоны', video: '🎬 Видео', audio: '🎵 Музыка', storage: '💾 Хранилище', other: '• Прочее' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(v) { return String(Math.round(v || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function dt(iso) { if (!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
  var tt; function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 3500); }

  function api(path, body) {
    var opt = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Admin-Token': T } };
    if (body) opt.body = JSON.stringify(body);
    return fetch(path, opt).then(function (r) {
      if (r.status === 401) { T = ''; sessionStorage.removeItem('ny_admin'); login(); throw new Error('auth'); }
      return r.json();
    });
  }

  /* ---------- вход ---------- */
  function login(msg) {
    app.innerHTML = '<div class="login card"><h2 style="margin:0 0 8px">🔐 Админ-панель <span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">НейроЯги</span></h2>' +
      '<p>Код для входа придёт в Telegram от бота поддержки.</p>' +
      '<button class="btn" id="getcode" style="width:100%">Получить код в Telegram</button>' +
      '<div id="codebox" style="display:none;margin-top:14px"><input class="in code" id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">' +
      '<button class="btn" id="enter" style="width:100%;margin-top:10px">Войти</button></div>' +
      '<p id="lerr" style="color:#ff9fb8;min-height:20px">' + esc(msg || '') + '</p></div>';
    document.getElementById('getcode').onclick = function () {
      var b = this; b.disabled = true;
      fetch('/api/admin/code', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (r) {
        b.disabled = false;
        if (!r.ok) { document.getElementById('lerr').textContent = r.error || 'Ошибка'; return; }
        b.textContent = 'Отправить код ещё раз';
        document.getElementById('codebox').style.display = 'block'; document.getElementById('code').focus();
        document.getElementById('lerr').textContent = '';
      }).catch(function () { b.disabled = false; document.getElementById('lerr').textContent = 'Нет связи с сервером'; });
    };
    var enter = function () {
      var c = document.getElementById('code').value.trim();
      fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: c }) })
        .then(function (r) { return r.json(); }).then(function (r) {
          if (!r.ok) { document.getElementById('lerr').textContent = r.error || 'Неверный код'; return; }
          T = r.token; sessionStorage.setItem('ny_admin', T); main();
        });
    };
    document.getElementById('enter').onclick = enter;
    document.getElementById('code').onkeydown = function (e) { if (e.key === 'Enter') enter(); };
  }

  /* ---------- каркас ---------- */
  function main() {
    app.innerHTML = '<div class="top"><h1>🛠 Админ-панель <i>НейроЯги</i></h1><button class="ghost" id="logout">Выйти</button></div>' +
      '<div class="tabs"><button data-t="sum">📊 Сводка</button><button data-t="users">👥 Клиенты</button><button data-t="forum">📣 Форум</button><button data-t="hall">💬 Чат</button><button data-t="promo">🎟 Промокоды</button></div><div id="view"></div>';
    document.getElementById('logout').onclick = function () { sessionStorage.removeItem('ny_admin'); T = ''; login(); };
    app.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { S.tab = b.getAttribute('data-t'); S.user = null; show(); }; });
    show();
  }
  function show() {
    app.querySelectorAll('[data-t]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === S.tab); });
    if (S.user) return userView(S.user);
    if (S.tab === 'sum') summary(); else if (S.tab === 'promo') promos(); else if (S.tab === 'forum') forum(); else if (S.tab === 'hall') hall(); else users();
  }
  function view(h) { document.getElementById('view').innerHTML = h; }

  /* ---------- сводка ---------- */
  function summary() {
    view('<p class="dim">Загружаю…</p>');
    api('/api/admin/stats').then(function (r) {
      if (!r.ok) { view('<p>' + esc(r.error) + '</p>'); return; }
      var rv = r.revenue, u = r.users;
      var h = '<div class="grid">' +
        '<div class="kpi hot"><small>Выручка сегодня</small><b>' + n(rv.today) + ' ₽</b></div>' +
        '<div class="kpi"><small>За 7 дней</small><b>' + n(rv.d7) + ' ₽</b></div>' +
        '<div class="kpi"><small>За 30 дней</small><b>' + n(rv.d30) + ' ₽</b><small>' + rv.n30 + ' платежей</small></div>' +
        '<div class="kpi"><small>Всего с начала</small><b>' + n(rv.total) + ' ₽</b></div>' +
        '<div class="kpi"><small>Клиентов всего</small><b>' + n(u.total) + '</b><small>активны за 7 дней: ' + n(u.active7) + '</small></div>' +
        '<div class="kpi"><small>Новые: сегодня / 7 / 30 дней</small><b>' + u.d1 + ' / ' + u.d7 + ' / ' + u.d30 + '</b></div>' +
        '<div class="kpi"><small>Кредитов на балансах</small><b>' + n(u.credits) + '</b><small>это ваш долг перед клиентами</small></div>' +
        '<div class="kpi"><small>👑 VIP / 💾 Хранилище</small><b>' + r.vip + ' / ' + r.storage + '</b><small>в поддержке сейчас: ' + r.support_online + '</small></div></div>';
      var mx = Math.max.apply(null, r.days.map(function (d) { return d.s; }).concat([1]));
      h += '<div class="card"><h3>Выручка за 14 дней</h3>' + (r.days.length ? '<div class="chart">' + r.days.map(function (d) {
        return '<div><em>' + (d.s ? n(d.s) : '') + '</em><i style="height:' + Math.max(2, Math.round(d.s / mx * 110)) + 'px"></i><span>' + esc(d.d) + '</span></div>';
      }).join('') + '</div>' : '<p class="dim">Платежей пока нет</p>') + '</div>';
      var cm = Math.max.apply(null, r.categories.map(function (c) { return c.s; }).concat([1]));
      h += '<div class="two"><div class="card"><h3>Траты клиентов за 30 дней</h3>' + (r.categories.length ? r.categories.map(function (c) {
        return '<div class="bar"><span>' + esc(CAT[c.c] || c.c) + '</span><div><i style="width:' + Math.max(3, Math.round(c.s / cm * 100)) + '%"></i></div><b>' + n(c.s) + ' кр.</b></div>';
      }).join('') : '<p class="dim">Пока пусто</p>') + '</div>' +
        '<div class="card"><h3>Популярные шаблоны за 30 дней</h3>' + (r.templates.length ? '<table><tr><th>Шаблон</th><th>Запусков</th><th>Кредитов</th></tr>' + r.templates.map(function (t) {
          return '<tr><td>' + esc(t.t) + '</td><td>' + t.n + '</td><td>' + n(t.s) + '</td></tr>';
        }).join('') + '</table>' : '<p class="dim">Пока пусто</p>') + '</div></div>';
      h += '<div class="card"><h3>Последние платежи</h3><div class="tbl"><table><tr><th>Когда</th><th>Клиент</th><th>Сумма</th><th>Кредитов</th></tr>' +
        (r.payments.map(function (p) { return '<tr class="click" data-u="' + esc(p.email) + '"><td>' + dt(p.at) + '</td><td>' + esc(p.email) + '</td><td class="p">' + n(p.rub) + ' ₽</td><td>' + n(p.credits) + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="dim">Платежей пока нет</td></tr>') +
        '</table></div></div>';
      h += '<p class="dim" style="font-size:12.5px">Бот Telegram: ' + (r.bot ? '✅ подключён' : '❌ не настроен') + ' · Чеки 54-ФЗ: ' + (r.receipts ? '✅ передаются в ЮKassa' : '⚪ не передаются (YOOKASSA_RECEIPT)') + '</p>';
      view(h); bindUsers();
    }).catch(function () {});
  }

  /* ---------- промокоды ---------- */
  function promos() {
    var h = '<div class="card"><h3>➕ Новый промокод</h3>' +
      '<div class="row"><input class="in" id="pc" placeholder="Код, например BLOGER100" style="text-transform:uppercase">' +
      '<select class="in" id="pk" style="max-width:230px"><option value="credits">Кредиты на баланс</option><option value="percent">Бонус % к пополнению</option></select></div>' +
      '<div class="row" style="margin-top:8px"><input class="in" id="pv" type="number" placeholder="Сколько (кр. или %)"><input class="in" id="pm" type="number" placeholder="Сколько раз всего" value="100">' +
      '<input class="in" id="pd" type="number" placeholder="Действует дней (0 — бессрочно)" value="30"><input class="in" id="pn" type="number" placeholder="Только для новых: дней с регистрации (0 — всем)" value="0"></div>' +
      '<div class="row" style="margin-top:8px"><input class="in" id="pnote" placeholder="Заметка: для какого блогера, акции"><button class="btn" id="pgo">Создать</button></div>' +
      '<p class="dim" style="font-size:12.5px;margin:8px 0 0">Каждый клиент может использовать код один раз. Бонус к пополнению — до 50%, действует 7 дней после ввода и срабатывает на ближайшей оплате.</p></div>' +
      '<div id="plist"><p class="dim">Загружаю…</p></div>';
    view(h);
    document.getElementById('pgo').onclick = function () {
      var body = { code: document.getElementById('pc').value.trim(), kind: document.getElementById('pk').value, value: +document.getElementById('pv').value,
        max_uses: +document.getElementById('pm').value, days: +document.getElementById('pd').value, new_only_days: +document.getElementById('pn').value,
        note: document.getElementById('pnote').value.trim() };
      api('/api/admin/promo', body).then(function (x) { toast(x.ok ? 'Создан ' + x.code : x.error); if (x.ok) promos(); });
    };
    api('/api/admin/promos').then(function (r) {
      var h2 = '<div class="card tbl"><h3>Промокоды</h3><table><tr><th>Код</th><th>Даёт</th><th>Использовано</th><th>До</th><th>Условия</th><th></th></tr>' +
        (r.promos.map(function (p) {
          return '<tr><td><b>' + esc(p.code) + '</b>' + (p.note ? '<br><span class="dim" style="font-size:12px">' + esc(p.note) + '</span>' : '') + '</td>' +
            '<td>' + (p.kind === 'credits' ? '+' + n(p.value) + ' кр.' : '+' + p.value + '% к пополнению') + '</td>' +
            '<td>' + p.used + ' / ' + n(p.max_uses) + '</td><td>' + (p.expires || 'бессрочно') + '</td>' +
            '<td class="dim" style="font-size:12.5px">' + (p.new_only_days ? 'новым (до ' + p.new_only_days + ' дн.)' : 'всем') + '</td>' +
            '<td><button class="ghost' + (p.active ? ' danger' : '') + '" data-tg="' + esc(p.code) + '">' + (p.active ? 'Выключить' : 'Включить') + '</button></td></tr>';
        }).join('') || '<tr><td colspan="6" class="dim">Промокодов пока нет</td></tr>') + '</table></div>';
      h2 += '<div class="card tbl"><h3>🎁 Подарочные сертификаты</h3><table><tr><th>Код</th><th>Купил</th><th>Номинал</th><th>Когда</th><th>Активировал</th></tr>' +
        (r.gifts.map(function (g) {
          return '<tr><td style="font-family:ui-monospace,Menlo,monospace">' + esc(g.code) + '</td><td>' + esc(g.buyer) + '</td><td>' + n(g.credits) + ' кр. / ' + n(g.rub) + ' ₽</td><td>' + esc(g.created) + '</td>' +
            '<td>' + (g.used_by ? esc(g.used_by) + '<br><span class="dim" style="font-size:12px">' + esc(g.used) + '</span>' : '<span class="dim">ещё не активирован</span>') + '</td></tr>';
        }).join('') || '<tr><td colspan="5" class="dim">Сертификатов пока не покупали</td></tr>') + '</table></div>';
      document.getElementById('plist').innerHTML = h2;
      document.querySelectorAll('[data-tg]').forEach(function (b) {
        b.onclick = function () { api('/api/admin/promo/toggle', { code: b.getAttribute('data-tg') }).then(function (x) { toast(x.ok ? (x.active ? 'Включён' : 'Выключен') : x.error); promos(); }); };
      });
    }).catch(function () {});
  }

  function hall() {
    view('<div id="hlist"><p class="dim">Загружаю…</p></div>');
    api('/api/admin/hall').then(function (r) {
      var bans = (r.bans || []).map(function (b) {
        return '<tr><td>' + esc(b.nick || '—') + '<br><span class="dim" style="font-size:12px">' + esc(b.email) + '</span></td><td>' + esc(b.at) + '</td><td><button class="ghost" data-unban="' + esc(b.email) + '">Вернуть в чат</button></td></tr>';
      }).join('') || '<tr><td colspan="3" class="dim">Никто не заблокирован</td></tr>';
      var msgs = (r.messages || []).map(function (m) {
        return '<tr><td>' + esc(m.at) + '</td><td>' + esc(m.nick || '—') + (m.banned ? ' <span class="tag" style="background:rgba(255,80,120,.2);color:#ff9fb8">чат закрыт</span>' : '') + '<br><span class="dim" style="font-size:12px">' + esc(m.email) + '</span></td><td>' + esc(m.text) + (m.hidden ? ' <span class="dim">· удалено</span>' : '') + '</td><td><button class="ghost danger" data-hhide="' + m.id + '" data-on="' + (m.hidden ? '0' : '1') + '">' + (m.hidden ? 'Вернуть' : 'Удалить') + '</button> <button class="ghost' + (m.banned ? '' : ' danger') + '" data-hban="' + esc(m.email) + '" data-on="' + (m.banned ? '0' : '1') + '">' + (m.banned ? 'Разбанить' : 'Закрыть чат') + '</button></td></tr>';
      }).join('') || '<tr><td colspan="4" class="dim">Сообщений нет</td></tr>';
      document.getElementById('hlist').innerHTML = '<div class="card tbl"><h3>Кто не может писать</h3><table><tr><th>Кто</th><th>Когда</th><th></th></tr>' + bans + '</table></div><div class="card tbl"><h3>Общий чат</h3><table><tr><th>Когда</th><th>Кто</th><th>Текст</th><th></th></tr>' + msgs + '</table></div>';
      document.querySelectorAll('[data-hhide]').forEach(function (b) {
        b.onclick = function () { api('/api/admin/hall/hide', { id: +b.getAttribute('data-hhide'), hidden: b.getAttribute('data-on') === '1' }).then(function () { hall(); }); };
      });
      document.querySelectorAll('[data-hban],[data-unban]').forEach(function (b) {
        b.onclick = function () {
          var email = b.getAttribute('data-hban') || b.getAttribute('data-unban');
          var on = b.hasAttribute('data-unban') ? false : b.getAttribute('data-on') === '1';
          api('/api/admin/hall/ban', { email: email, banned: on }).then(function (x) { toast(x.ok ? (x.banned ? 'Чат закрыт' : 'Снова может писать') : (x.error || 'Ошибка')); hall(); });
        };
      });
    }).catch(function () {});
  }

  /* ---------- форум ---------- */
  function forum() {
    view('<div class="card"><div class="row"><input class="in" id="fq" placeholder="Ник, почта, подпись или текст комментария"><button class="btn" id="fgo">Найти</button></div></div><div id="flist"><p class="dim">Загружаю…</p></div>');
    function ban(email, blocked) {
      if (!confirm(blocked ? 'Убрать ' + email + ' из чёрного списка?' : 'В чёрный список: ' + email + '?\nЕго посты и комментарии скроются. Писать и публиковать он не сможет.')) return;
      api('/api/admin/block', { email: email, blocked: !blocked }).then(function (x) {
        toast(x.ok ? (x.blocked ? 'В чёрном списке' : 'Убран из списка') : (x.error || 'Ошибка'));
        if (x.ok) run();
      });
    }
    var run = function () {
      var q = document.getElementById('fq').value.trim();
      api('/api/admin/forum?q=' + encodeURIComponent(q)).then(function (r) {
        var posts = '<div class="card tbl"><h3>Посты</h3><table><tr><th>Когда</th><th>Ник</th><th>Подпись</th><th>Лайки</th><th>Просмотры</th><th>Комм.</th><th></th></tr>' +
          ((r.posts || []).map(function (p) {
            return '<tr><td>' + esc(p.at) + '</td><td>' + esc(p.nick || '—') + (p.blocked ? ' <span class="tag" style="background:rgba(255,80,120,.2);color:#ff9fb8">ЧС</span>' : '') +
              '<br><span class="dim" style="font-size:12px">' + esc(p.email) + '</span></td><td>' +
              esc(p.caption || '—') + '<br><span class="dim" style="font-size:12px">' + (p.origin === 'template' ? 'шаблон, промт скрыт' : (p.share_prompt ? 'свой промт открыт' : 'свой промт скрыт')) +
              (p.hidden ? ' · скрыт' : '') + '</span></td><td>честные ' + n(p.likes || 0) + '<br><span class="dim" style="font-size:12px">накрутка +' + n(p.likes_boost || 0) + '<br>в ленте ' + n((p.likes || 0) + (p.likes_boost || 0)) + '</span></td><td>' +
              n((p.views || 0) + (p.views_boost || 0)) + '<br><span class="dim" style="font-size:12px">+' + n(p.views_boost || 0) + '</span></td><td>' + n(p.comments || 0) + '</td><td>' +
              '<div class="row"><input class="in" data-bl="' + p.id + '" type="number" placeholder="+лайки" style="max-width:90px"><input class="in" data-bv="' + p.id + '" type="number" placeholder="+просм." style="max-width:90px"><button class="ghost" data-boost="' + p.id + '">Накрутить</button></div>' +
              '<button class="ghost' + (p.hidden ? '' : ' danger') + '" data-hide="' + p.id + '" data-on="' + (p.hidden ? '0' : '1') + '">' + (p.hidden ? 'Вернуть' : 'Скрыть') + '</button> ' +
              '<button class="ghost' + (p.blocked ? '' : ' danger') + '" data-ban="' + esc(p.email) + '" data-blocked="' + (p.blocked ? '1' : '0') + '">' + (p.blocked ? 'Из ЧС' : 'В ЧС') + '</button></td></tr>';
          }).join('') || '<tr><td colspan="7" class="dim">Постов нет</td></tr>') + '</table></div>';
        var comments = '<div class="card tbl"><h3>Комментарии</h3><table><tr><th>Когда</th><th>Кто</th><th>Текст</th><th>Пост</th><th></th></tr>' +
          ((r.comments || []).map(function (c) {
            return '<tr><td>' + esc(c.at) + '</td><td>' + esc(c.nick || '—') + (c.blocked ? ' <span class="tag" style="background:rgba(255,80,120,.2);color:#ff9fb8">ЧС</span>' : '') +
              '<br><span class="dim" style="font-size:12px">' + esc(c.email) + '</span></td><td>' + esc(c.text) +
              (c.hidden ? '<br><span class="dim" style="font-size:12px">скрыт</span>' : '') + '</td><td>#' + c.post_id + '</td><td>' +
              '<button class="ghost' + (c.hidden ? '' : ' danger') + '" data-chide="' + c.id + '" data-on="' + (c.hidden ? '0' : '1') + '">' + (c.hidden ? 'Вернуть' : 'Скрыть') + '</button> ' +
              '<button class="ghost' + (c.blocked ? '' : ' danger') + '" data-ban="' + esc(c.email) + '" data-blocked="' + (c.blocked ? '1' : '0') + '">' + (c.blocked ? 'Из ЧС' : 'В ЧС') + '</button></td></tr>';
          }).join('') || '<tr><td colspan="5" class="dim">Комментариев нет</td></tr>') + '</table></div>';
        var leaders = '<div class="card tbl"><h3>Рейтинг, как в ленте</h3><p class="dim">Честные — настоящие нажатия. Накрутка — то, что добавлено здесь. В ленте люди видят сумму, она совпадает с лайками на постах.</p><table><tr><th>#</th><th>Ник</th><th>Честные</th><th>Накрутка</th><th>В ленте</th><th>Честные за 7 дней</th></tr>' +
          ((r.leaders || []).map(function (a, i) {
            return '<tr><td>' + (i + 1) + '</td><td>' + esc(a.nick) + '<br><span class="dim" style="font-size:12px">' + esc(a.email) + '</span></td><td>' + n(a.real) + '</td><td>' + n(a.boost) + '</td><td>' + n(a.shown) + '</td><td>' + n(a.week_real) + '</td></tr>';
          }).join('') || '<tr><td colspan="6" class="dim">Пока некого считать</td></tr>') + '</table></div>';
        var boosted = '<div class="card tbl"><h3>Накрученные лайки</h3><table><tr><th>Пост</th><th>Ник</th><th>Честные</th><th>Накрутка</th><th>В ленте</th></tr>' +
          ((r.boosted || []).map(function (p) {
            return '<tr><td>#' + p.id + '<br><span class="dim" style="font-size:12px">' + esc(p.caption || '—') + '</span></td><td>' + esc(p.nick || '—') + '</td><td>' + n(p.real) + '</td><td>+' + n(p.boost) + (p.views_boost ? '<br><span class="dim" style="font-size:12px">просмотры +' + n(p.views_boost) + '</span>' : '') + '</td><td>' + n((p.real || 0) + (p.boost || 0)) + '</td></tr>';
          }).join('') || '<tr><td colspan="5" class="dim">Накрутки ещё нет</td></tr>') + '</table></div>';
        document.getElementById('flist').innerHTML = leaders + boosted + posts + comments;
        document.querySelectorAll('[data-boost]').forEach(function (b) {
          b.onclick = function () {
            var id = b.getAttribute('data-boost');
            var likes = parseInt((document.querySelector('[data-bl="' + id + '"]') || {}).value, 10) || 0;
            var views = parseInt((document.querySelector('[data-bv="' + id + '"]') || {}).value, 10) || 0;
            if (!likes && !views) { toast('Укажите лайки или просмотры'); return; }
            api('/api/admin/forum/boost', { id: +id, likes: likes, views: views }).then(function (x) {
              toast(x.ok ? 'Накрутка сохранена' : (x.error || 'Ошибка')); if (x.ok) run();
            });
          };
        });
        document.querySelectorAll('[data-hide]').forEach(function (b) {
          b.onclick = function () {
            api('/api/admin/forum/hide', { id: parseInt(b.getAttribute('data-hide'), 10), hidden: b.getAttribute('data-on') === '1' }).then(function (x) {
              toast(x.ok ? 'Готово' : (x.error || 'Ошибка')); if (x.ok) run();
            });
          };
        });
        document.querySelectorAll('[data-chide]').forEach(function (b) {
          b.onclick = function () {
            api('/api/admin/forum/comment/hide', { id: parseInt(b.getAttribute('data-chide'), 10), hidden: b.getAttribute('data-on') === '1' }).then(function (x) {
              toast(x.ok ? 'Готово' : (x.error || 'Ошибка')); if (x.ok) run();
            });
          };
        });
        document.querySelectorAll('[data-ban]').forEach(function (b) {
          b.onclick = function () { ban(b.getAttribute('data-ban'), b.getAttribute('data-blocked') === '1'); };
        });
      }).catch(function () {});
    };
    document.getElementById('fgo').onclick = run;
    document.getElementById('fq').onkeydown = function (e) { if (e.key === 'Enter') run(); };
    run();
  }

  /* ---------- клиенты ---------- */
  function users() {
    view('<div class="card"><div class="row"><input class="in" id="q" placeholder="Поиск по почте или нику" value="' + esc(S.q) + '"><button class="btn" id="go">Найти</button></div></div><div id="list"><p class="dim">Загружаю…</p></div>');
    var run = function () {
      S.q = document.getElementById('q').value.trim();
      api('/api/admin/users?q=' + encodeURIComponent(S.q)).then(function (r) {
        document.getElementById('list').innerHTML = '<div class="card tbl"><table><tr><th>Почта</th><th>Ник</th><th>Баланс</th><th>Оплатил</th><th>Статус</th><th>Последний вход</th></tr>' +
          (r.users.map(function (u) {
            return '<tr class="click" data-u="' + esc(u.email) + '"><td>' + esc(u.email) + (u.blocked ? ' <span class="tag" style="background:rgba(255,80,120,.2);color:#ff9fb8">ЧС</span>' : '') + '</td><td>' + esc(u.nick || '—') + '</td><td>' + n(u.credits) + ' кр.</td><td>' + n(u.paid) + ' ₽</td><td>' +
              (u.vip ? '<span class="tag vip">👑 VIP до ' + esc(u.vip) + '</span>' : '') + '</td><td>' + dt(u.last || u.created) + '</td></tr>';
          }).join('') || '<tr><td colspan="6" class="dim">Никого не нашли</td></tr>') + '</table></div>';
        bindUsers();
      }).catch(function () {});
    };
    document.getElementById('go').onclick = run;
    document.getElementById('q').onkeydown = function (e) { if (e.key === 'Enter') run(); };
    run();
  }
  function bindUsers() {
    document.querySelectorAll('[data-u]').forEach(function (tr) { tr.onclick = function () { S.user = tr.getAttribute('data-u'); show(); window.scrollTo(0, 0); }; });
  }

  /* ---------- карточка клиента ---------- */
  function userView(email) {
    view('<p class="dim">Загружаю…</p>');
    api('/api/admin/user/' + encodeURIComponent(email)).then(function (r) {
      if (!r.ok) { view('<p>' + esc(r.error) + '</p><button class="ghost" id="back">← Назад</button>'); document.getElementById('back').onclick = function () { S.user = null; show(); }; return; }
      var h = '<button class="ghost" id="back" style="margin-bottom:12px">← Назад</button>';
      h += '<div class="card"><h3 style="font-size:18px;word-break:break-all">' + esc(r.email) + (r.nick ? ' · ' + esc(r.nick) : ' · ника нет') + ' ' + (r.vip ? '<span class="tag vip">👑 VIP до ' + esc(r.vip) + '</span>' : '') + (r.storage ? ' <span class="tag on">💾 Хранилище до ' + esc(r.storage) + '</span>' : '') + (r.blocked ? ' <span class="tag" style="background:rgba(255,80,120,.2);color:#ff9fb8">ЧС</span>' : '') + '</h3>' +
        '<div class="grid" style="margin:0"><div class="kpi hot"><small>Баланс</small><b>' + n(r.credits) + ' кр.</b></div><div class="kpi"><small>Оплатил всего</small><b>' + n(r.paid) + ' ₽</b></div>' +
        '<div class="kpi"><small>Регистрация</small><b style="font-size:15px">' + esc(r.created) + '</b><small>вход: ' + esc(r.last || '—') + '</small></div>' +
        '<div class="kpi"><small>Работ / рефералов</small><b>' + r.works + ' / ' + r.invited + '</b><small>код: ' + esc(r.ref_code || '—') + (r.ref_by ? ' · пригласил ' + esc(r.ref_by.inviter) : '') + '</small></div></div></div>';
      h += '<div class="two"><div class="card"><h3>💰 Начислить или списать кредиты</h3><div class="row"><input class="in" id="cd" type="number" placeholder="Например 100 или -50" style="max-width:190px"><input class="in" id="cr" placeholder="Причина (видна клиенту)"></div>' +
        '<div class="row" style="margin-top:8px"><button class="btn" id="cgo">Применить</button><span class="dim" style="font-size:12.5px">Причина появится в истории клиента</span></div></div>' +
        '<div class="card"><h3>👑 VIP, 🔑 пароль и 🚫 чёрный список</h3><div class="row"><button class="ghost" data-vip="30">VIP +30 дней</button><button class="ghost" data-vip="365">VIP +1 год</button><button class="ghost danger" data-vip="0">Снять VIP</button></div>' +
        '<div class="row" style="margin-top:10px"><button class="ghost" id="pw">Задать новый пароль</button><button class="ghost' + (r.blocked ? '' : ' danger') + '" id="ban">' + (r.blocked ? 'Убрать из ЧС' : 'В чёрный список') + '</button></div><div id="pwbox"></div></div></div>';
      h += '<div class="card"><h3>🏷 Метка и место в ленте</h3><p class="dim" style="margin-top:0">Подпись показывается под аватаром. Закреплённый аккаунт всегда первый в кружках ленты.</p><div class="row"><input class="in" id="mk" maxlength="48" placeholder="Например: НейроЯга AI Поддержка" value="' + esc(r.mark || '') + '"></div>' +
        '<div class="row" style="margin-top:8px"><label class="dim"><input type="checkbox" id="pin"' + (r.pin ? ' checked' : '') + '> Всегда на виду в ленте</label><button class="btn" id="mgo">Сохранить</button></div></div>';
      h += '<div class="card"><h3>Платежи</h3><div class="tbl"><table><tr><th>Когда</th><th>Сумма</th><th>Кредитов</th><th>ID платежа</th></tr>' +
        (r.payments.map(function (p) { return '<tr><td>' + esc(p.at) + '</td><td class="p">' + n(p.rub) + ' ₽</td><td>' + n(p.credits) + '</td><td class="dim" style="font-size:12px">' + esc(p.id) + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="dim">Платежей нет</td></tr>') + '</table></div></div>';
      h += '<div class="card"><h3>История операций (последние 100)</h3><div class="tbl"><table><tr><th>Когда</th><th>Операция</th><th>Сумма</th><th>Остаток</th></tr>' +
        (r.history.map(function (t) { return '<tr><td>' + esc(t.at) + '</td><td>' + esc(t.kind) + (t.note ? '<br><span class="dim" style="font-size:12.5px">' + esc(t.note) + '</span>' : '') + '</td><td class="' + (t.delta >= 0 ? 'p' : 'm') + '">' + (t.delta > 0 ? '+' : '') + n(t.delta) + '</td><td>' + n(t.balance) + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="dim">Операций нет</td></tr>') + '</table></div></div>';
      view(h);
      document.getElementById('back').onclick = function () { S.user = null; show(); };
      document.getElementById('cgo').onclick = function () {
        var d = parseInt(document.getElementById('cd').value, 10), reason = document.getElementById('cr').value.trim();
        if (!d) { toast('Укажите количество кредитов'); return; }
        if (!reason) { toast('Укажите причину'); return; }
        if (!confirm((d > 0 ? 'Начислить ' : 'Списать ') + Math.abs(d) + ' кр. клиенту ' + email + '?')) return;
        api('/api/admin/credits', { email: email, delta: d, reason: reason }).then(function (x) { toast(x.ok ? 'Готово. Баланс: ' + n(x.credits) + ' кр.' : x.error); if (x.ok) userView(email); });
      };
      document.querySelectorAll('[data-vip]').forEach(function (b) {
        b.onclick = function () {
          var days = +b.getAttribute('data-vip');
          if (!confirm(days ? 'Выдать VIP на ' + days + ' дней?' : 'Снять VIP?')) return;
          api('/api/admin/vip', { email: email, days: days }).then(function (x) { toast(x.ok ? (x.vip ? 'VIP до ' + x.vip : 'VIP снят') : x.error); if (x.ok) userView(email); });
        };
      });
      document.getElementById('pw').onclick = function () {
        if (!confirm('Задать клиенту новый случайный пароль? Старый перестанет работать.')) return;
        api('/api/admin/password', { email: email }).then(function (x) {
          if (!x.ok) { toast(x.error); return; }
          document.getElementById('pwbox').innerHTML = '<p class="dim" style="margin:10px 0 0">Новый пароль (скопируйте и отправьте клиенту):</p><div class="pw">' + esc(x.password) + '</div>';
        });
      };
      document.getElementById('ban').onclick = function () {
        var on = !r.blocked;
        if (!confirm(on ? 'В чёрный список?\nПосты и комментарии скроются. Писать и публиковать нельзя. Генерации останутся.' : 'Убрать из чёрного списка? Скрытые посты сами не вернутся — их нужно вернуть вручную.')) return;
        api('/api/admin/block', { email: email, blocked: on }).then(function (x) {
          toast(x.ok ? (x.blocked ? 'В чёрном списке' : 'Убран из списка') : (x.error || 'Ошибка'));
          if (x.ok) userView(email);
        });
      };
      document.getElementById('mgo').onclick = function () {
        api('/api/admin/mark', { email: email, mark: document.getElementById('mk').value.trim(), pin: document.getElementById('pin').checked }).then(function (x) {
          toast(x.ok ? 'Метка сохранена' : (x.error || 'Ошибка'));
          if (x.ok) userView(email);
        });
      };
    }).catch(function () {});
  }

  if (T) main(); else login();
})();
</script>
</body>
</html>
